name: VAL-003 Tail Design Monte Carlo

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/val-003-design-mc.yml"

permissions:
  contents: read

jobs:
  design-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Run clustered rare-event Monte Carlo
        run: |
          mkdir -p evidence/VAL-003-DESIGN
          python -m finite_ram_lab.val003_design_mc \
            --simulations 10000 \
            --seed 2026092616 \
            --out evidence/VAL-003-DESIGN/design.json \
            --markdown evidence/VAL-003-DESIGN/summary.md
          cat evidence/VAL-003-DESIGN/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: VAL-003-DESIGN-${{ github.run_id }}
          path: evidence/VAL-003-DESIGN/
          if-no-files-found: error
          retention-days: 90
