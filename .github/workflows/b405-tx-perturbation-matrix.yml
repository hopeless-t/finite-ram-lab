name: B405 transaction perturbation matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launch/B405-TX-PERTURBATION-MATRIX-v1.txt"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - name: Compile workers
        run: |
          mkdir -p build
          gcc -O2 -Wall -Wextra -std=c11             experiments/tx_perturbation_worker.c             -o build/tx_perturbation_worker
          gcc -O2 -Wall -Wextra -std=c11             experiments/obs005_handoff_worker.c             -o build/obs005_handoff_worker

      - name: Environment gate
        run: |
          set -euo pipefail
          test "$(getconf PAGESIZE)" = "4096"
          test "$(stat -fc %T /sys/fs/cgroup)" = "cgroup2fs"
          test "$(nproc)" -ge 3
          uname -a
          cat /sys/kernel/mm/transparent_hugepage/enabled || true

      - name: Run perturbation block
        env:
          BLOCK: "${{ matrix.block }}"
        run: |
          set -euo pipefail
          TRACE=/sys/kernel/tracing
          OUT="$GITHUB_WORKSPACE/evidence/B405/block-$BLOCK"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          if ! mountpoint -q "$TRACE"; then
            sudo mount -t tracefs nodev "$TRACE"
          fi

          cleanup() (
            set +e
            echo 0 | sudo tee "$TRACE/tracing_on" >/dev/null 2>&1
            for ev in               frl_refill_stock frl_trigger_refill frl_scrubber_refill frl_pc_uncharge_any frl_pc_try64 frl_pc_uncharge17               frl_lru_flush frl_folios_put frl_drain_stock; do
              if test -e "$TRACE/events/kprobes/$ev/enable"; then
                echo 0 | sudo tee "$TRACE/events/kprobes/$ev/enable" >/dev/null 2>&1
              fi
              printf '%s\n' "-:$ev"                 | sudo tee -a "$TRACE/kprobe_events" >/dev/null 2>&1
            done
            true
          )
          trap cleanup EXIT
          cleanup

          printf '%s\n'             'p:frl_refill_stock refill_stock memcg=$arg1:x64 nr_pages=$arg2:u32 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_trigger_refill refill_stock memcg=$arg1:x64 nr_pages=$arg2:u32 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_scrubber_refill refill_stock memcg=$arg1:x64 nr_pages=$arg2:u32 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_pc_uncharge_any page_counter_uncharge counter=$arg1:x64 nr_pages=$arg2:u64 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_pc_try64 page_counter_try_charge counter=$arg1:x64 nr_pages=$arg2:u64 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_pc_uncharge17 page_counter_uncharge counter=$arg1:x64 nr_pages=$arg2:u64 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_lru_flush folio_batch_move_lru fbatch=$arg1:x64 nr=+0($arg1):u8 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_folios_put folios_put_refs fbatch=$arg1:x64 nr=+0($arg1):u8 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_drain_stock drain_stock stock=$arg1:x64 slot=$arg2:u32 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null

          echo 'comm == "frltx405" && nr_pages == 63'             | sudo tee "$TRACE/events/kprobes/frl_refill_stock/filter" >/dev/null
          echo 'comm == "frltrig" && nr_pages == 63'             | sudo tee "$TRACE/events/kprobes/frl_trigger_refill/filter" >/dev/null
          echo 'comm == "frlscrub" && nr_pages == 63'             | sudo tee "$TRACE/events/kprobes/frl_scrubber_refill/filter" >/dev/null
          echo 'comm == "frltx405" && nr_pages == 64'             | sudo tee "$TRACE/events/kprobes/frl_pc_try64/filter" >/dev/null
          echo 'nr_pages == 17'             | sudo tee "$TRACE/events/kprobes/frl_pc_uncharge17/filter" >/dev/null
          echo 'stacktrace'             | sudo tee "$TRACE/events/kprobes/frl_pc_uncharge17/trigger" >/dev/null
          echo 'nr == 31'             | sudo tee "$TRACE/events/kprobes/frl_lru_flush/filter" >/dev/null
          echo 'nr == 31'             | sudo tee "$TRACE/events/kprobes/frl_folios_put/filter" >/dev/null

          for ev in             frl_refill_stock frl_trigger_refill frl_scrubber_refill frl_pc_uncharge_any frl_pc_try64 frl_pc_uncharge17             frl_lru_flush frl_folios_put frl_drain_stock; do
            echo 1 | sudo tee "$TRACE/events/kprobes/$ev/enable" >/dev/null
            sudo cat "$TRACE/events/kprobes/$ev/format" > "$OUT/$ev.format"
          done

          RUNNER_UID="$(id -u)"
          PYTHON_BIN="$(command -v python)"
          echo 65536 | sudo tee "$TRACE/buffer_size_kb" >/dev/null
          echo 0 | sudo tee "$TRACE/tracing_on" >/dev/null
          echo | sudo tee "$TRACE/trace" >/dev/null
          echo 1 | sudo tee "$TRACE/tracing_on" >/dev/null

          sudo -E "$PYTHON_BIN"             -m finite_ram_lab.tx_perturbation_matrix run-block             --spec "$GITHUB_WORKSPACE/specs/TX-PERTURBATION-MATRIX-v1.json"             --block "$BLOCK"             --worker "$GITHUB_WORKSPACE/build/tx_perturbation_worker"             --handoff-worker "$GITHUB_WORKSPACE/build/obs005_handoff_worker"             --out-root "$OUT"             --trace-marker "$TRACE/trace_marker"             --trace-path "$TRACE/trace"             --worker-uid "$RUNNER_UID"

          echo 0 | sudo tee "$TRACE/tracing_on" >/dev/null
          sudo cat "$TRACE/trace" > "$OUT/trace.log"
          sudo cat "$TRACE/kprobe_profile" > "$OUT/kprobe-profile.txt" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b405-block-${{ matrix.block }}
          path: evidence/B405/block-${{ matrix.block }}/
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    needs: block
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - uses: actions/download-artifact@v8
        with:
          pattern: b405-block-*
          path: evidence/B405/input

      - name: Aggregate
        run: |
          mkdir -p evidence/B405/aggregate
          python -m finite_ram_lab.tx_perturbation_matrix aggregate             --spec specs/TX-PERTURBATION-MATRIX-v1.json             --input-root evidence/B405/input             --json-out evidence/B405/aggregate/summary.json

      - name: Freeze raw evidence manifest
        run: |
          frl evidence-manifest             evidence/B405/input             --out evidence/B405/aggregate/full-raw-evidence-manifest.json             --experiment-id TX-PERTURBATION-MATRIX-v1             --run-id "$GITHUB_RUN_ID"             --source-commit "$GITHUB_SHA"             --tier HOT             --origin-provider github-actions             --origin-ref "run:$GITHUB_RUN_ID"

      - name: Verify raw evidence
        run: |
          frl evidence-verify             evidence/B405/input             --manifest evidence/B405/aggregate/full-raw-evidence-manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: B405-TX-PERTURBATION-MATRIX-${{ github.run_id }}
          path: evidence/B405/aggregate/
          if-no-files-found: error
          retention-days: 30

      - name: Assert causal matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("evidence/B405/aggregate/summary.json")
          result = json.loads(p.read_text())
          print(json.dumps({
              "matrix_pass": result["matrix_pass"],
              "challenge_pass_count": result["challenge_pass_count"],
              "completion_pass_count": result["completion_pass_count"],
              "end_to_end_pass": result["end_to_end_pass"],
              "target_fail": result["target_fail"],
              "by_arm": result["by_arm"],
          }, sort_keys=True))
          if not result["matrix_pass"]:
              raise SystemExit("B405 causal classification matrix did not pass")
          PY
