name: FR-CLM-001C Reliability Residency Surface

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-clm-001c-reliability-residency-surface
    paths:
      - "src/finite_ram_lab/semantic_reliability_surface.py"
      - "src/finite_ram_lab/semantic_working_set.py"
      - "specs/FR-CLM-001C.json"
      - "tests/test_semantic_reliability_surface.py"
      - "docs/FR-CLM-001C-RELIABILITY-RESIDENCY-SURFACE.md"
      - ".github/workflows/fr-clm-001c.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_semantic_reliability_surface -v
      - name: Run reliability-residency surface
        run: |
          mkdir -p runs/FR-CLM-001C
          python -m finite_ram_lab.semantic_reliability_surface \
            > runs/FR-CLM-001C/result.json
          python - <<'PY'
          import json
          r=json.load(open("runs/FR-CLM-001C/result.json"))
          assert r["status"] == "PASS"
          f=r["minimum_qualified_budget_by_error"]
          assert f["0.0"] == 2
          assert f["0.02"] == 4
          assert f["0.05"] == 6
          assert f["0.1"] == 8
          assert r["rare_event_sentinel"]["failure_count"] == 30
          assert r["empirical_model_claim"] is False
          PY
          sha256sum specs/FR-CLM-001C.json
          sha256sum runs/FR-CLM-001C/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-clm-001c-reliability-residency-surface
          path: runs/FR-CLM-001C/result.json
          if-no-files-found: error
