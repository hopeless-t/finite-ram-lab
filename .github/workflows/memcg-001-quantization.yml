name: MEMCG-001 Page Charge Quantization v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "launch/MEMCG-001-v1.txt"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Compile C worker
        run: |
          mkdir -p build
          gcc -O2 -Wall -Wextra -std=c11 -D_GNU_SOURCE \
            experiments/memcg001_worker.c \
            -o build/memcg001_worker
      - name: Build schedule and environment
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          ROOT="evidence/MEMCG-001/block-${BLOCK}"
          mkdir -p "${ROOT}/raw"
          python -m finite_ram_lab.memcg001_quantization schedule \
            --spec specs/MEMCG-001-PAGE-CHARGE-QUANTIZATION-v1.json \
            --block "${BLOCK}" \
            --out "${ROOT}/schedule.csv"
          {
            echo "kernel_release=$(uname -r)"
            echo "systemd_version=$(systemd-run --version | head -n1)"
            echo "cgroup_fs_type=$(stat -fc %T /sys/fs/cgroup)"
            echo "page_size=$(getconf PAGESIZE)"
            echo "online_cpus=$(nproc)"
            echo "image_os=${ImageOS:-}"
            echo "image_version=${ImageVersion:-}"
            echo "runner_arch=${RUNNER_ARCH:-}"
            cat /etc/os-release
          } > "${ROOT}/environment.txt"
          test "$(getconf PAGESIZE)" = "4096"
          test "$(stat -fc %T /sys/fs/cgroup)" = "cgroup2fs"
      - name: Run touch and control trials
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/evidence/MEMCG-001/block-${BLOCK}"
          WORKER="$GITHUB_WORKSPACE/build/memcg001_worker"

          tail -n +2 "${ROOT}/schedule.csv" | while IFS=, read -r ORDER MODE; do
            UNIT="finite-ram-memcg001-${GITHUB_RUN_ID}-${BLOCK}-${ORDER}"
            OUT="${ROOT}/raw/trial-${BLOCK}-${ORDER}-${MODE}.csv"
            sudo systemd-run \
              --pipe --wait --collect --quiet \
              --unit="$UNIT" \
              -p MemoryAccounting=yes \
              "$WORKER" --mode "$MODE" --steps 256 > "$OUT"
          done
          sudo chown -R "$(id -u):$(id -g)" "${ROOT}"
      - uses: actions/upload-artifact@v7
        with:
          name: memcg001-block-${{ matrix.block }}
          path: evidence/MEMCG-001/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: block
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - uses: actions/download-artifact@v8
        with:
          pattern: memcg001-block-*
          path: evidence/MEMCG-001/input
      - name: Aggregate mathematical analysis
        run: |
          mkdir -p evidence/MEMCG-001/aggregate
          python -m finite_ram_lab.memcg001_quantization aggregate \
            --spec specs/MEMCG-001-PAGE-CHARGE-QUANTIZATION-v1.json \
            --input-root evidence/MEMCG-001/input \
            --out evidence/MEMCG-001/aggregate/summary.json \
            --samples-out evidence/MEMCG-001/aggregate/samples.csv
      - uses: actions/upload-artifact@v7
        with:
          name: MEMCG-001-QUANTIZATION-${{ github.run_id }}
          path: evidence/MEMCG-001/aggregate/
          if-no-files-found: error
          retention-days: 90
