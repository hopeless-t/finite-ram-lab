name: REC-004 Pre-Post Observer Hygiene v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "launch/REC-004-v1.txt"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"

      - name: Prepare cold files
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from finite_ram_lab.strata001_probe import _prepare_file
          root = Path(os.environ["RUNNER_TEMP"]) / "rec004"
          root.mkdir(parents=True, exist_ok=True)
          for size in (96, 192, 384):
              p = root / f"cold-{size}.bin"
              _prepare_file(p, size * 1024 * 1024, 4 * 1024 * 1024)
              print(p)
          PY

      - name: Build schedule and environment
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          ROOT="evidence/REC-004/block-${BLOCK}"
          mkdir -p "${ROOT}/raw"
          python -m finite_ram_lab.rec004_prepost_observer_hygiene schedule \
            --spec specs/REC-004-PREPOST-OBSERVER-HYGIENE-v1.json \
            --block "${BLOCK}" \
            --out "${ROOT}/schedule.csv"
          {
            echo "kernel_release=$(uname -r)"
            echo "systemd_version=$(systemd-run --version | head -n1)"
            echo "cgroup_fs_type=$(stat -fc %T /sys/fs/cgroup)"
            echo "image_os=${ImageOS:-}"
            echo "image_version=${ImageVersion:-}"
            cat /etc/os-release
          } > "${ROOT}/environment.txt"

      - name: Run paired hygiene trials
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          HIGH_BYTES=$((160 * 1024 * 1024))
          MAX_BYTES=$((320 * 1024 * 1024))
          SPEC="$GITHUB_WORKSPACE/specs/REC-004-PREPOST-OBSERVER-HYGIENE-v1.json"
          ROOT="$GITHUB_WORKSPACE/evidence/REC-004/block-${BLOCK}"
          FILE_ROOT="$RUNNER_TEMP/rec004"

          tail -n +2 "${ROOT}/schedule.csv" | while IFS=, read -r ORDER SIZE; do
            FILE="${FILE_ROOT}/cold-${SIZE}.bin"

            # Cold verification deliberately occurs outside the measured unit.
            "$PY" - <<PY
          from pathlib import Path
          from finite_ram_lab.strata001_probe import _file_residency
          r = _file_residency(Path("$FILE"))
          assert r["resident_fraction"] <= 0.1, r
          PY

            UNIT="finite-ram-rec004-${GITHUB_RUN_ID}-${BLOCK}-${ORDER}"
            OUT="${ROOT}/raw/trial-${ORDER}-${SIZE}m.json"

            sudo systemd-run \
              --pipe --wait --collect --quiet \
              --unit="$UNIT" \
              -p MemoryAccounting=yes \
              -p MemoryHigh="$HIGH_BYTES" \
              -p MemoryMax="$MAX_BYTES" \
              "$PY" -m finite_ram_lab.rec004_prepost_observer_hygiene trial \
                --spec "$SPEC" \
                --block "$BLOCK" \
                --order "$ORDER" \
                --size-mib "$SIZE" \
                --file "$FILE" \
                --source-commit "$GITHUB_SHA" \
                --out "$OUT"
          done
          sudo chown -R "$(id -u):$(id -g)" "${ROOT}"

      - uses: actions/upload-artifact@v7
        with:
          name: rec004-block-${{ matrix.block }}
          path: evidence/REC-004/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: block
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - uses: actions/download-artifact@v8
        with:
          pattern: rec004-block-*
          path: evidence/REC-004/input
      - name: Aggregate
        run: |
          mkdir -p evidence/REC-004/aggregate
          python -m finite_ram_lab.rec004_prepost_observer_hygiene aggregate \
            --spec specs/REC-004-PREPOST-OBSERVER-HYGIENE-v1.json \
            --input-root evidence/REC-004/input \
            --out evidence/REC-004/aggregate/summary.json
      - uses: actions/upload-artifact@v7
        with:
          name: REC-004-PREPOST-OBSERVER-${{ github.run_id }}
          path: evidence/REC-004/aggregate/
          if-no-files-found: error
          retention-days: 90
