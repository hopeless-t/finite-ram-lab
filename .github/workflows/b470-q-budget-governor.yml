name: B470 q Budget Governor

on:
  workflow_dispatch:
  push:
    branches:
      - research/q-budget-governor-b470
    paths:
      - "src/finite_ram_lab/q_budget_governor.py"
      - "tests/test_q_budget_governor.py"
      - "docs/B470-Q-BUDGET-GOVERNOR-v0.1.md"
      - ".github/workflows/b470-q-budget-governor.yml"

permissions:
  contents: read

jobs:
  qualify-governor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_q_budget_governor -v
      - name: Freeze governor policy
        run: |
          mkdir -p runs/B470
          python -m finite_ram_lab.q_budget_governor \
            --source analysis/inputs/B469-LANE-CONCURRENCY-RESULT-v0.1.json \
            --out runs/B470/governor.json
          python -m json.tool runs/B470/governor.json >/dev/null
          sha256sum runs/B470/governor.json
      - name: Freeze example decisions
        run: |
          python -m finite_ram_lab.q_budget_governor \
            --source analysis/inputs/B469-LANE-CONCURRENCY-RESULT-v0.1.json \
            --risk-mode median \
            --peak-budget-bytes 67024896 \
            --out runs/B470/decision-median-small-budget.json
          python -m finite_ram_lab.q_budget_governor \
            --source analysis/inputs/B469-LANE-CONCURRENCY-RESULT-v0.1.json \
            --risk-mode observed_upper \
            --peak-budget-bytes 67050000 \
            --out runs/B470/decision-upper-small-budget.json
      - uses: actions/upload-artifact@v4
        with:
          name: b470-q-budget-governor
          path: runs/B470
          if-no-files-found: error
