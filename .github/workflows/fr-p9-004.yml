name: FR-P9-004 Parallelism Residency Tax

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-p9-004-parallelism-residency-tax
    paths:
      - "src/finite_ram_lab/fr_p9_004_parallelism_tax.py"
      - "tests/test_fr_p9_004_parallelism_tax.py"
      - "specs/FR-P9-004.json"
      - "docs/FR-P9-004-PARALLELISM-RESIDENCY-TAX.md"
      - ".github/workflows/fr-p9-004.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_fr_p9_004_parallelism_tax -v
      - name: Run hosted PSS proxy
        run: |
          mkdir -p runs/FR-P9-004
          python -m finite_ram_lab.fr_p9_004_parallelism_tax \
            --physical --payload-mib 16 --repetitions 3 \
            > runs/FR-P9-004/result.json
          python - <<'PY'
          import json
          r = json.load(open("runs/FR-P9-004/result.json"))
          assert r["status"] == "PASS"
          assert r["authority_effect"] == "NONE"
          assert r["probe"]["payload_bytes"] == 16 * 1024 * 1024
          assert r["probe"]["worker_counts"] == [1, 4]
          assert r["probe"]["repetitions"] == 3
          assert r["checks"]["all_semantic_digests_exact"] is True
          assert r["scaling"]["private_growth_scale_many_vs_one"] >= 2.5
          assert r["scaling"]["shared_growth_scale_many_vs_one"] <= 2.0
          assert r["scaling"]["shared_vs_private_growth_ratio_at_many"] <= 0.60
          PY
          sha256sum specs/FR-P9-004.json
          sha256sum runs/FR-P9-004/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-p9-004-parallelism-residency-tax
          path: runs/FR-P9-004/result.json
          if-no-files-found: error
