name: STRATA-001 Capability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Run Strata-inspired direct-I/O capability probe
        run: |
          set -euo pipefail
          mkdir -p evidence/STRATA-001
          python -m finite_ram_lab.strata001_probe \
            --spec specs/STRATA-001-CAPABILITY.json \
            --dir "$RUNNER_TEMP/strata001-capability" \
            --out evidence/STRATA-001/capability.json

      - name: Validate evidence shape
        run: |
          python -m json.tool evidence/STRATA-001/capability.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open("evidence/STRATA-001/capability.json"))
          assert d["status"] in {"PASS", "CAPABILITY_HOLD", "FAIL", "INVALID"}, d
          print(json.dumps({
              "status": d["status"],
              "checks": d["checks"],
              "post_cache": {
                  k: v["post"]["resident_fraction"]
                  for k, v in d["arms"].items()
              },
              "mount": d["host"]["mount"],
          }, indent=2, sort_keys=True))
          PY

      - name: Job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("evidence/STRATA-001/capability.json"))
          print("# STRATA-001 Capability")
          print()
          print("Inspired by [Niko1221/Strata](https://github.com/Niko1221/Strata).")
          print()
          print(f"Status: **{d['status']}**")
          print()
          print("| arm | pre-cache | post-cache | elapsed ms | error |")
          print("| --- | ---: | ---: | ---: | --- |")
          for name, a in d["arms"].items():
              ms=a["scan"]["elapsed_ns"]/1e6
              print(f"| {name} | {a['pre']['resident_fraction']:.4f} | {a['post']['resident_fraction']:.4f} | {ms:.3f} | {a['scan']['error'] or ''} |")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: STRATA-001-CAPABILITY-${{ github.run_id }}
          path: evidence/STRATA-001/
          if-no-files-found: error
          retention-days: 90
