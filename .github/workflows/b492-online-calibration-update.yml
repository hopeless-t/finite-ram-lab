name: B492 Online Calibration Update

on:
  workflow_dispatch:
  push:
    branches:
      - research/online-calibration-update-b492
    paths:
      - "src/finite_ram_lab/online_calibration_update.py"
      - "tests/test_online_calibration_update.py"
      - "docs/B492-ONLINE-CALIBRATION-UPDATE-v0.1.md"
      - ".github/workflows/b492-online-calibration-update.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_online_calibration_update -v
      - name: Freeze online calibration update
        run: |
          mkdir -p runs/B492
          python -m finite_ram_lab.online_calibration_update \
            --b489 analysis/inputs/B489-REPAIRED-CALIBRATION-RESULT-v0.1.json \
            --b491 analysis/inputs/B491-REPAIRED-GOVERNOR-DOGFOOD-RESULT-v0.1.json \
            --out runs/B492/online-calibration-update.json
          python -m json.tool runs/B492/online-calibration-update.json >/dev/null
          sha256sum runs/B492/online-calibration-update.json
      - uses: actions/upload-artifact@v4
        with:
          name: b492-online-calibration-update
          path: runs/B492/online-calibration-update.json
          if-no-files-found: error
