name: STRATA-007 Cross-Image Portability v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "launch/STRATA-007-v1.txt"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - name: Prepare cold file
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from finite_ram_lab.strata001_probe import _prepare_file
          p = Path(os.environ["RUNNER_TEMP"]) / "strata007-cold.bin"
          _prepare_file(p, 96 * 1024 * 1024, 4 * 1024 * 1024)
          print(p)
          PY

      - name: Build schedule and environment
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          ROOT="evidence/STRATA-007/block-${BLOCK}"
          mkdir -p "${ROOT}/raw"
          python -m finite_ram_lab.strata007_cross_image schedule \
            --spec specs/STRATA-007-CROSS-IMAGE-v1.json \
            --block "${BLOCK}" \
            --out "${ROOT}/schedule.csv"
          {
            echo "kernel_release=$(uname -r)"
            echo "systemd_version=$(systemd --version | head -n1)"
            echo "cgroup_fs_type=$(stat -fc %T /sys/fs/cgroup)"
            echo "image_os=${ImageOS:-}"
            echo "image_version=${ImageVersion:-}"
            echo "runner_arch=${RUNNER_ARCH:-}"
            cat /etc/os-release
          } > "${ROOT}/environment.txt"

      - name: Run six-arm panel with Recorder
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          HIGH_BYTES=$((160 * 1024 * 1024))
          MAX_BYTES=$((320 * 1024 * 1024))
          FILE="$RUNNER_TEMP/strata007-cold.bin"
          SPEC="$GITHUB_WORKSPACE/specs/STRATA-007-CROSS-IMAGE-v1.json"
          ROOT="$GITHUB_WORKSPACE/evidence/STRATA-007/block-${BLOCK}"

          tail -n +2 "${ROOT}/schedule.csv" | while IFS=, read -r ORDER ARM; do
            UNIT="finite-ram-strata007-${GITHUB_RUN_ID}-${BLOCK}-${ORDER}"
            OUT="${ROOT}/raw/trial-${ORDER}-${ARM}.json"
            RAW="${ROOT}/raw/trial-${ORDER}-${ARM}.jsonl"

            sudo systemd-run \
              --pipe --wait --collect --quiet \
              --unit="$UNIT" \
              -p MemoryAccounting=yes \
              -p MemoryHigh="$HIGH_BYTES" \
              -p MemoryMax="$MAX_BYTES" \
              "$PY" -m finite_ram_lab.strata007_cross_image trial \
                --spec "$SPEC" \
                --block "$BLOCK" \
                --order "$ORDER" \
                --arm "$ARM" \
                --source-commit "$GITHUB_SHA" \
                --file "$FILE" \
                --raw-evidence "$RAW" \
                --out "$OUT"
          done

          sudo chown -R "$(id -u):$(id -g)" "${ROOT}"

      - uses: actions/upload-artifact@v7
        with:
          name: strata007-ubuntu2604-block-${{ matrix.block }}
          path: evidence/STRATA-007/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: block
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - uses: actions/download-artifact@v8
        with:
          pattern: strata007-ubuntu2604-block-*
          path: evidence/STRATA-007/input

      - name: Aggregate
        run: |
          mkdir -p evidence/STRATA-007/aggregate
          python -m finite_ram_lab.strata007_cross_image aggregate \
            --spec specs/STRATA-007-CROSS-IMAGE-v1.json \
            --input-root evidence/STRATA-007/input \
            --out evidence/STRATA-007/aggregate/summary.json

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("evidence/STRATA-007/aggregate/summary.json"))
          print("# STRATA-007 Cross-Image Portability v1")
          print()
          print(f"Trials: {s['trial_count']}")
          print(f"Runner: {s['runner']}")
          print()
          print("| Arm | median high events | positive trials | peak MiB | non-hot floor MiB |")
          print("| --- | ---: | ---: | ---: | ---: |")
          for arm, c in s["cells"].items():
              print(
                  f"| {arm} | {c['median_memory_high_events']:.1f} | "
                  f"{c['positive_high_event_trials']} | "
                  f"{c['median_max_scan_memory_bytes']/(1024*1024):.3f} | "
                  f"{c['median_post_scan_non_hot_floor_mib']:.3f} |"
              )
          print()
          print(s["onset_screen"]["raw_release_interval_bracket"])
          print(s["onset_screen"]["knee_plus_hot_bracket"])
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: STRATA-007-CROSS-IMAGE-${{ github.run_id }}
          path: evidence/STRATA-007/aggregate/
          if-no-files-found: error
          retention-days: 90
