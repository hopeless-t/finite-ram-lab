name: GATE-001 Empirical Policy Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gate-001-policy-analysis.yml"

permissions:
  contents: read

jobs:
  policy-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Run empirical policy analysis
        run: |
          mkdir -p evidence/GATE-001-POLICY
          python -m finite_ram_lab.gate001_policy \
            --spec specs/GATE-001-DESIGN.json \
            --out evidence/GATE-001-POLICY/policy.json \
            --markdown evidence/GATE-001-POLICY/summary.md
          cat evidence/GATE-001-POLICY/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: GATE-001-POLICY-${{ github.run_id }}
          path: evidence/GATE-001-POLICY/
          if-no-files-found: error
          retention-days: 90
