name: FR-P9-012 Horizon Price Policy Regions

on:
  push:
    branches:
      - research/fr-p9-012-horizon-price-policy-regions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted policy compiler tests
        run: python -m unittest tests.test_fr_p9_012_horizon_price_policy_regions -v
      - name: Compile and verify policy regions
        run: |
          mkdir -p runs/FR-P9-012
          python -m finite_ram_lab.fr_p9_012_horizon_price_policy_regions \
            > runs/FR-P9-012/result.json
          python - <<'PY'
          import json
          r = json.load(open("runs/FR-P9-012/result.json"))
          assert r["status"] == "PASS"
          assert r["classification"] == "ANALYTIC_COMPILATION_OVER_HOSTED_FR_P9_011_ANCHORS"
          assert r["authority_effect"] == "NONE"
          assert r["retry_authority"] is False
          assert r["scalar_gain"] is None
          assert r["verification"]["comparisons"] >= 1000
          assert r["verification"]["mismatches"] == []
          assert r["checks"]["break_even_price_rises_with_reuse_horizon"] is True
          assert r["checks"]["no_external_price_leaves_both_feasible_policies_unresolved"] is True
          assert r["checks"]["capacity_feasibility_precedes_scalar_price"] is True
          assert all(r["checks"].values())
          PY
          sha256sum specs/FR-P9-012.json
          sha256sum runs/FR-P9-012/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-p9-012-horizon-price-policy-regions
          path: runs/FR-P9-012/result.json
          if-no-files-found: error
