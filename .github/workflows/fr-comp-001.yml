name: FR-COMP-001 Compressibility Surface

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-comp-001-compressibility-surface
    paths:
      - "src/finite_ram_lab/fr_compressibility_surface.py"
      - "tests/test_fr_compressibility_surface.py"
      - "specs/FR-COMP-001.json"
      - "docs/FR-COMP-001-COMPRESSIBILITY-SURFACE.md"
      - ".github/workflows/fr-comp-001.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest tests.test_fr_compressibility_surface -v
      - name: Run physical codec surface
        run: |
          mkdir -p runs/FR-COMP-001
          python -m finite_ram_lab.fr_compressibility_surface > runs/FR-COMP-001/result.json
          python - <<'PY'
          import json
          r=json.load(open("runs/FR-COMP-001/result.json"))
          assert r["status"] == "PASS"
          q=r["qualification"]
          assert q["zero_max_ratio"] < 0.01
          assert q["repeated_min_ratio"] < 0.01
          assert q["repeated_codec_spread"] > 0.05
          assert q["random_min_ratio"] > 0.98
          PY
          sha256sum specs/FR-COMP-001.json
          sha256sum runs/FR-COMP-001/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-comp-001-compressibility-surface
          path: runs/FR-COMP-001/result.json
          if-no-files-found: error
