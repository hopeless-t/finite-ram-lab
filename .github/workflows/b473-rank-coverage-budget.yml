name: B473 Rank Coverage Budget

on:
  workflow_dispatch:
  push:
    branches:
      - research/rank-coverage-budget-b473
    paths:
      - "src/finite_ram_lab/rank_coverage_budget.py"
      - "tests/test_rank_coverage_budget.py"
      - "docs/B473-RANK-COVERAGE-BUDGET-v0.1.md"
      - ".github/workflows/b473-rank-coverage-budget.yml"

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_rank_coverage_budget -v
      - name: Freeze 95 percent sample budget
        run: |
          mkdir -p runs/B473
          python -m finite_ram_lab.rank_coverage_budget \
            --b469 analysis/inputs/B469-LANE-CONCURRENCY-RESULT-v0.1.json \
            --b471 analysis/inputs/B471-GOVERNOR-COMPLIANCE-RESULT-v0.1.json \
            --b472 analysis/inputs/B472-Q1-TAIL-CALIBRATION-RESULT-v0.1.json \
            --target-coverage 0.95 \
            --out runs/B473/rank-coverage-budget.json
          python -m json.tool runs/B473/rank-coverage-budget.json >/dev/null
          sha256sum runs/B473/rank-coverage-budget.json
      - uses: actions/upload-artifact@v4
        with:
          name: b473-rank-coverage-budget
          path: runs/B473/rank-coverage-budget.json
          if-no-files-found: error
