name: B482 Prematerialized Input Isolation

on:
  workflow_dispatch:
  push:
    branches:
      - research/prematerialized-input-b482
    paths:
      - "src/finite_ram_lab/prematerialized_input.py"
      - "src/finite_ram_lab/prematerialized_input_aggregate.py"
      - "tests/test_prematerialized_input.py"
      - "docs/B482-PREMATERIALIZED-INPUT-v0.1.md"
      - ".github/workflows/b482-prematerialized-input.yml"

permissions:
  contents: read

jobs:
  block:
    strategy:
      fail-fast: false
      matrix:
        block: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Run content block
        run: |
          mkdir -p runs/B482
          python -m finite_ram_lab.prematerialized_input \
            --block-id ${{ matrix.block }} \
            --work-dir runs/B482/work-${{ matrix.block }} \
            --size 2048 \
            --out runs/B482/block-${{ matrix.block }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: b482-content-block-${{ matrix.block }}
          path: runs/B482/block-${{ matrix.block }}.json
          if-no-files-found: error

  aggregate:
    needs: block
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Targeted tests
        run: python -m unittest tests.test_prematerialized_input -v
      - uses: actions/download-artifact@v4
        with:
          pattern: b482-content-block-*
          path: runs/B482/blocks
          merge-multiple: true
      - name: Aggregate content isolation
        run: |
          python -m finite_ram_lab.prematerialized_input_aggregate \
            --blocks-dir runs/B482/blocks \
            --out runs/B482/prematerialized-input.json
          python -m json.tool runs/B482/prematerialized-input.json >/dev/null
          sha256sum runs/B482/prematerialized-input.json
      - uses: actions/upload-artifact@v4
        with:
          name: b482-prematerialized-input
          path: runs/B482/prematerialized-input.json
          if-no-files-found: error
