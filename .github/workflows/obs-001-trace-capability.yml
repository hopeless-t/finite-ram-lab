name: OBS-001 memcg trace capability gate

on:
  push:
    branches: [main]
    paths:
      - "launch/OBS-001-TRACE-CAPABILITY-v5.txt"

permissions:
  contents: read

jobs:
  trace-capability:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Kernel and symbol receipt
        run: |
          set -euo pipefail
          uname -a
          getconf PAGESIZE
          for sym in \
            memcg_uncharge drain_stock uncharge_batch uncharge_folio \
            refill_stock try_charge_memcg page_counter_uncharge; do
            printf '%-24s ' "$sym"
            grep -w "$sym" /proc/kallsyms | head -1 || true
          done

      - name: Kprobe capability gate
        run: |
          set -euo pipefail

          TRACE=/sys/kernel/tracing
          if ! mountpoint -q "$TRACE"; then
            sudo mount -t tracefs nodev "$TRACE"
          fi

          cleanup() (
            set +e
            for ev in \
              frl_drain_stock frl_uncharge_batch frl_refill_stock \
              frl_try_charge frl_page_counter_uncharge; do
              if test -e "$TRACE/events/kprobes/$ev/enable"; then
                echo 0 | sudo tee "$TRACE/events/kprobes/$ev/enable" >/dev/null 2>&1
              fi
              printf '%s\n' "-:$ev" | sudo tee -a "$TRACE/kprobe_events" >/dev/null 2>&1
            done
            true
          )
          trap cleanup EXIT
          cleanup

          sudo test -e "$TRACE/kprobe_events"

          : > capability.tsv
          printf 'symbol\tvisible\tprobeable\n' >> capability.tsv

          try_probe() {
            sym="$1"
            ev="$2"
            spec="$3"

            if grep -qw "$sym" /proc/kallsyms; then
              visible=1
            else
              visible=0
            fi

            if printf '%s\n' "$spec" | sudo tee -a "$TRACE/kprobe_events" >/dev/null 2>&1; then
              probeable=1
              echo 1 | sudo tee "$TRACE/events/kprobes/$ev/enable" >/dev/null
              echo 0 | sudo tee "$TRACE/events/kprobes/$ev/enable" >/dev/null
              sudo cat "$TRACE/events/kprobes/$ev/format"
            else
              probeable=0
            fi

            printf '%s\t%s\t%s\n' "$sym" "$visible" "$probeable" >> capability.tsv
          }

          try_probe \
            drain_stock frl_drain_stock \
            'p:frl_drain_stock drain_stock stock=$arg1:x64 slot=$arg2:u32'

          try_probe \
            uncharge_batch frl_uncharge_batch \
            'p:frl_uncharge_batch uncharge_batch ug=$arg1:x64'

          try_probe \
            refill_stock frl_refill_stock \
            'p:frl_refill_stock refill_stock memcg=$arg1:x64 nr_pages=$arg2:u32'

          try_probe \
            try_charge_memcg frl_try_charge \
            'p:frl_try_charge try_charge_memcg memcg=$arg1:x64 nr_pages=$arg3:u32'

          try_probe \
            page_counter_uncharge frl_page_counter_uncharge \
            'p:frl_page_counter_uncharge page_counter_uncharge counter=$arg1:x64 nr_pages=$arg2:u64'

          cat capability.tsv

          echo "=== FILTER/TRIGGER TEST ==="
          echo 'nr_pages == 17'             | sudo tee "$TRACE/events/kprobes/frl_page_counter_uncharge/filter"
          echo 'stacktrace'             | sudo tee "$TRACE/events/kprobes/frl_page_counter_uncharge/trigger"

          echo "=== BUFFER/TRACE TEST ==="
          echo 0 | sudo tee "$TRACE/tracing_on"
          echo 4096 | sudo tee "$TRACE/buffer_size_kb"
          echo | sudo tee "$TRACE/trace"
          echo 1 | sudo tee "$TRACE/tracing_on"

          echo "=== ROOT TRACE MARKER TEST ==="
          PYTHON_BIN="$(command -v python)"
          sudo -E "$PYTHON_BIN" -c 'from pathlib import Path; Path("/sys/kernel/tracing/trace_marker").write_text("FRL_OBS001_CAPABILITY_MARKER\\n")'
          echo 0 | sudo tee "$TRACE/tracing_on"
          sudo grep -F 'FRL_OBS001_CAPABILITY_MARKER' "$TRACE/trace"

          probeable_count="$(awk 'NR>1 && $3==1 {n++} END {print n+0}' capability.tsv)"
          if test "$probeable_count" -lt 2; then
            echo "TRACE_CAPABILITY_HOLD: fewer than two useful probe points"
            exit 20
          fi

          echo "TRACE_CAPABILITY_PASS"

      - name: Cleanup readback
        if: always()
        run: |
          set -euo pipefail
          TRACE=/sys/kernel/tracing
          if mountpoint -q "$TRACE"; then
            for ev in \
              frl_drain_stock frl_uncharge_batch frl_refill_stock \
              frl_try_charge frl_page_counter_uncharge; do
              if test -e "$TRACE/events/kprobes/$ev/enable"; then
                echo "cleanup_fail: $ev still exists"
                exit 30
              fi
            done
          fi
          echo "TRACE_CLEANUP_PASS"
