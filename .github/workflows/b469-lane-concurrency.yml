name: B469 Lane Concurrency Sweep

on:
  workflow_dispatch:
  push:
    branches:
      - research/lane-concurrency-sweep-b469
    paths:
      - "src/finite_ram_lab/lane_concurrency_sweep.py"
      - "tests/test_lane_concurrency_sweep.py"
      - "specs/TX-LANE-CONCURRENCY-SWEEP-B469-v0.1.json"
      - "docs/B469-LANE-CONCURRENCY-SWEEP-v0.1.md"
      - ".github/workflows/b469-lane-concurrency.yml"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Targeted tests
        run: python -m unittest tests.test_lane_concurrency_sweep -v
      - name: Frozen q sweep
        run: |
          mkdir -p runs/B469
          python -m finite_ram_lab.lane_concurrency_sweep \
            --repetitions 4 \
            --size 2048 \
            --lanes 7 \
            --seed 469 \
            --value-limit 50 \
            --tile-rows 64 \
            --out runs/B469/lane-concurrency-sweep.json
          python -m json.tool runs/B469/lane-concurrency-sweep.json >/dev/null
          sha256sum runs/B469/lane-concurrency-sweep.json
      - uses: actions/upload-artifact@v4
        with:
          name: b469-lane-concurrency-sweep
          path: runs/B469/lane-concurrency-sweep.json
          if-no-files-found: error
