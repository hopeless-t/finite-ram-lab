name: REC-002 Recorder Overhead v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "launch/REC-002-v1.txt"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - name: Prepare cold file outside trial cgroups
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from finite_ram_lab.strata001_probe import _prepare_file
          p = Path(os.environ["RUNNER_TEMP"]) / "rec002-cold.bin"
          _prepare_file(p, 96 * 1024 * 1024, 4 * 1024 * 1024)
          print(p)
          PY

      - name: Build paired schedule and capture environment
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          ROOT="evidence/REC-002/block-${BLOCK}"
          mkdir -p "${ROOT}/raw"
          python -m finite_ram_lab.rec002_overhead schedule             --block "${BLOCK}"             --out "${ROOT}/schedule.csv"

          {
            echo "kernel_release=$(uname -r)"
            echo "systemd_version=$(systemd --version | head -n1)"
            echo "cgroup_fs_type=$(stat -fc %T /sys/fs/cgroup)"
            cat /etc/os-release
          } > "${ROOT}/environment.txt"

      - name: Run recorder overhead pair
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          HIGH_BYTES=$((160 * 1024 * 1024))
          MAX_BYTES=$((320 * 1024 * 1024))
          FILE="$RUNNER_TEMP/rec002-cold.bin"
          ROOT="$GITHUB_WORKSPACE/evidence/REC-002/block-${BLOCK}"
          SCHEDULE="${ROOT}/schedule.csv"

          tail -n +2 "$SCHEDULE" | while IFS=, read -r ORDER MODE; do
            UNIT="finite-ram-rec002-${GITHUB_RUN_ID}-${BLOCK}-${ORDER}"
            OUT="${ROOT}/raw/trial-${ORDER}-${MODE}.json"
            EVIDENCE="${ROOT}/raw/trial-${ORDER}-${MODE}.jsonl"

            sudo systemd-run               --pipe --wait --collect --quiet               --unit="$UNIT"               -p MemoryAccounting=yes               -p MemoryHigh="$HIGH_BYTES"               -p MemoryMax="$MAX_BYTES"               "$PY" -m finite_ram_lab.rec002_overhead trial                 --mode "$MODE"                 --block "${BLOCK}"                 --order "$ORDER"                 --source-commit "$GITHUB_SHA"                 --file "$FILE"                 --raw-evidence "$EVIDENCE"                 --expected-high-bytes "$HIGH_BYTES"                 --expected-max-bytes "$MAX_BYTES"                 --out "$OUT"
          done

          sudo chown -R "$(id -u):$(id -g)" "${ROOT}"

      - uses: actions/upload-artifact@v7
        with:
          name: rec002-block-${{ matrix.block }}
          path: evidence/REC-002/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: block
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - uses: actions/download-artifact@v8
        with:
          pattern: rec002-block-*
          path: evidence/REC-002/input

      - name: Aggregate paired overhead
        run: |
          mkdir -p evidence/REC-002/aggregate
          python -m finite_ram_lab.rec002_overhead aggregate             --input-root evidence/REC-002/input             --out evidence/REC-002/aggregate/summary.json

      - name: Job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s=json.load(open("evidence/REC-002/aggregate/summary.json"))
          print("# REC-002 Recorder Overhead v1")
          print()
          print(f"Trials: {s['trial_count']} / blocks: {s['block_count']}")
          print()
          print("| Mode | high events | max scan MiB | scan ms | JSONL bytes |")
          print("| --- | ---: | ---: | ---: | ---: |")
          for mode in ("recorder_off", "recorder_on"):
              c=s["cells"][mode]
              print(
                  f"| {mode} | {c['median_memory_high_events']:.1f} | "
                  f"{c['median_max_scan_memory_bytes']/(1024*1024):.3f} | "
                  f"{c['median_scan_elapsed_ns']/1e6:.3f} | "
                  f"{c['median_jsonl_bytes']:.0f} |"
              )
          p=s["paired_medians"]
          print()
          print(f"Median paired high-event delta (on-off): {p['delta_memory_high_events']:.3f}")
          print(f"Median paired peak-memory delta bytes (on-off): {p['delta_max_scan_memory_bytes']:.0f}")
          print(f"Median paired scan-time ratio (on/off): {p['scan_elapsed_ratio_on_over_off']:.6f}")
          print()
          print("Screening result only; no universal transparency claim.")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: REC-002-OVERHEAD-${{ github.run_id }}
          path: evidence/REC-002/aggregate/
          if-no-files-found: error
          retention-days: 90
