name: FR-SOOM-002K Demand Folding Governor

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-soom-002k-demand-folding-governor
    paths:
      - "src/finite_ram_lab/semantic_demand_folding.py"
      - "specs/FR-SOOM-002K.json"
      - "tests/test_semantic_demand_folding.py"
      - "docs/FR-SOOM-002K-DEMAND-FOLDING-GOVERNOR.md"
      - ".github/workflows/fr-soom-002k.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_semantic_demand_folding -v
      - name: Run synthetic demand-folding panel
        run: |
          mkdir -p runs/FR-SOOM-002K
          python -m finite_ram_lab.semantic_demand_folding > runs/FR-SOOM-002K/result.json
          python - <<'PY'
          import json
          r = json.load(open("runs/FR-SOOM-002K/result.json"))
          assert r["status"] == "PASS"
          assert r["synthetic_only"] is True
          assert r["live_control_claim"] is False
          full = r["arms"]["FULL"]
          hys = r["arms"]["HYSTERESIS"]
          single = r["arms"]["SINGLE_THRESHOLD"]
          assert hys["total_useful_progress"] > full["total_useful_progress"]
          assert hys["pressure_gt_0_60_samples"] < full["pressure_gt_0_60_samples"]
          assert hys["control_transitions"] < single["control_transitions"]
          assert hys["min_concurrency"] >= 1
          PY
          sha256sum specs/FR-SOOM-002K.json
          sha256sum runs/FR-SOOM-002K/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-soom-002k-demand-folding
          path: runs/FR-SOOM-002K/result.json
          if-no-files-found: error
