name: FR-ATOM-001 Memory Efficiency Periodic Table

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-atom-001-memory-efficiency-periodic-table
    paths:
      - "src/finite_ram_lab/fr_memory_atoms.py"
      - "tests/test_fr_memory_atoms.py"
      - "specs/FR-ATOM-001.json"
      - "docs/FR-ATOM-001-MEMORY-EFFICIENCY-PERIODIC-TABLE.md"
      - ".github/workflows/fr-atom-001.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest tests.test_fr_memory_atoms -v
      - name: Freeze atomic inventory
        run: |
          mkdir -p runs/FR-ATOM-001
          python -m finite_ram_lab.fr_memory_atoms > runs/FR-ATOM-001/result.json
          python - <<'PY'
          import json
          r=json.load(open("runs/FR-ATOM-001/result.json"))
          assert r["status"] == "PASS"
          assert r["immediate_priorities"][0]["atom"] == "DUPLICATION_FACTOR"
          assert r["quantization_coverage"]["GGUF"] == "CONTAINER_AXIS_NOT_QUANTIZER"
          assert "ALLOCATOR_FRAGMENTATION" in r["coverage_summary"]["gap"]
          PY
          sha256sum specs/FR-ATOM-001.json
          sha256sum runs/FR-ATOM-001/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-atom-001-memory-efficiency-periodic-table
          path: runs/FR-ATOM-001/result.json
          if-no-files-found: error
