name: ENV-003 Pageout Capability

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/env-003.yml"
      - "src/finite_ram_lab/pageout_probe.py"
      - "specs/ENV-003.json"
      - "docs/ENV-003-DESIGN.md"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Run capability probes
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          mkdir -p "evidence/ENV-003/block-${BLOCK}"
          PY="$(command -v python)"
          if (( BLOCK % 2 == 0 )); then TARGETS="hotset burst"; else TARGETS="burst hotset"; fi
          for TARGET in $TARGETS; do
            UNIT="finite-ram-env003-${GITHUB_RUN_ID}-${BLOCK}-${TARGET}"
            OUT="$GITHUB_WORKSPACE/evidence/ENV-003/block-${BLOCK}/probe-${TARGET}.json"
            sudo systemd-run \
              --pipe --wait --collect --quiet \
              --unit="$UNIT" \
              -p MemoryAccounting=yes \
              -p MemoryHigh=268435456 \
              -p MemoryMax=335544320 \
              "$PY" -m finite_ram_lab.pageout_probe \
                --target "$TARGET" \
                --hotset-mib 64 \
                --burst-mib 96 \
                --target-mib 16 \
                --out "$OUT" >/dev/null
          done
          sudo chown -R "$(id -u):$(id -g)" "evidence/ENV-003/block-${BLOCK}"
      - uses: actions/upload-artifact@v4
        with:
          name: env003-block-${{ matrix.block }}
          path: evidence/ENV-003/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: block
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: env003-block-*
          path: evidence/ENV-003
      - name: Summarize
        run: |
          python - <<'PY'
          import glob,json,statistics,pathlib
          files=sorted(glob.glob('evidence/ENV-003/*/probe-*.json'))
          rows=[json.load(open(p)) for p in files]
          out={'experiment_id':'ENV-003','trials':len(rows),'all_calls_succeeded':all(r['call_success'] for r in rows),
               'all_content_match':all(r['content_match'] for r in rows),'no_oom':all(r['oom']==0 and r['oom_kill']==0 for r in rows),'targets':{}}
          for target in ('hotset','burst'):
              g=[r for r in rows if r['target']==target]
              vals=[r['reduction_fraction'] for r in g]
              out['targets'][target]={'trials':len(g),'median_reduction_fraction':statistics.median(vals),
                'min_reduction_fraction':min(vals),'max_reduction_fraction':max(vals),
                'median_retouch_ms':statistics.median([r['retouch_ns']/1e6 for r in g]),
                'median_swap_growth_mib':statistics.median([(r['swap_after']-r['swap_before'])/(1024*1024) for r in g])}
          pathlib.Path('evidence/ENV-003/aggregate').mkdir(parents=True,exist_ok=True)
          pathlib.Path('evidence/ENV-003/aggregate/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Job summary
        run: cat evidence/ENV-003/aggregate/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ENV-003-aggregate-${{ github.run_id }}
          path: evidence/ENV-003/aggregate/
          if-no-files-found: error
          retention-days: 90
