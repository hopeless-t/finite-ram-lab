name: FR-META-001 Recursive Research Loop

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-meta-001-recursive-research
    paths:
      - "src/finite_ram_lab/fr_recursive_research.py"
      - "tests/test_fr_recursive_research.py"
      - "specs/FR-META-001.json"
      - "docs/FR-META-001-RECURSIVE-RESEARCH-LOOP.md"
      - ".github/workflows/fr-meta-001.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest tests.test_fr_recursive_research -v
      - name: Run recursive research panel
        run: |
          mkdir -p runs/FR-META-001
          python -m finite_ram_lab.fr_recursive_research > runs/FR-META-001/result.json
          python - <<'PY'
          import json
          r=json.load(open("runs/FR-META-001/result.json"))
          assert r["status"] == "PASS"
          assert r["promotion_gate"]["pass"] is True
          assert r["capability_holdout"]["identical"] is True
          assert r["meta_meta"]["candidate_win_rate"] >= 0.90
          assert r["meta_meta"]["min_utility_delta"] > 0.0
          assert r["meta_meta"]["risky_promotable"] is False
          assert r["council"]["converged"] is True
          PY
          sha256sum specs/FR-META-001.json
          sha256sum runs/FR-META-001/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-meta-001-recursive-research
          path: runs/FR-META-001/result.json
          if-no-files-found: error
