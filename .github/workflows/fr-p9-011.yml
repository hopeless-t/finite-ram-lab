name: FR-P9-011 Repeated Phase Frontier

on:
  push:
    branches:
      - research/fr-p9-011-repeated-phase-frontier
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted helper tests
        run: python -m unittest tests.test_fr_p9_011_repeated_phase_frontier -v
      - name: Run repeated-phase typed-frontier falsifier
        run: |
          mkdir -p runs/FR-P9-011
          python -m finite_ram_lab.fr_p9_011_repeated_phase_frontier \
            --payload-mib 8 --workspace-mib 16 --workers 4 \
            --jobs-per-transition 12 --rounds 4 \
            --transition-counts 1,2,4,8 --repetitions 2 --high-quota-mib 256 \
            > runs/FR-P9-011/result.json
          python - <<'PY'
          import json
          r = json.load(open("runs/FR-P9-011/result.json"))
          assert r["status"] == "PASS"
          assert r["authority_effect"] == "NONE"
          assert r["retry_authority"] is False
          assert r["scalar_gain"] is None
          assert r["checks"]["all_runs_complete_and_preserve_semantics"] is True
          assert r["checks"]["high_quota_runs_have_no_kernel_oom"] is True
          assert r["checks"]["fault_in_has_lower_peak_at_every_horizon"] is True
          assert r["checks"]["keep_warm_has_lower_materialize_time_at_every_horizon"] is True
          assert r["checks"]["both_modes_remain_typed_pareto_at_every_horizon"] is True
          assert r["checks"]["long_horizon_fault_in_materialize_tax_exceeds_short_horizon"] is True
          assert all(r["checks"].values())
          PY
          sha256sum specs/FR-P9-011.json
          sha256sum runs/FR-P9-011/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-p9-011-repeated-phase-frontier
          path: runs/FR-P9-011/result.json
          if-no-files-found: error
