name: MEMCG-003B Non-Consuming Seven Slot v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "launch/MEMCG-003B-v1.txt"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Compile holder worker
        run: |
          mkdir -p build
          gcc -O2 -Wall -Wextra -std=c11 \
            experiments/memcg003_holder.c \
            -o build/memcg003_holder
      - name: Environment receipt
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          ROOT="evidence/MEMCG-003B/block-${BLOCK}"
          mkdir -p "$ROOT"
          {
            echo "kernel_release=$(uname -r)"
            echo "systemd_version=$(systemd-run --version | head -n1)"
            echo "cgroup_fs_type=$(stat -fc %T /sys/fs/cgroup)"
            echo "page_size=$(getconf PAGESIZE)"
            echo "allowed_cpus=$(python -c 'import os; print(sorted(os.sched_getaffinity(0)))')"
            echo "image_os=${ImageOS:-}"
            echo "image_version=${ImageVersion:-}"
            echo "runner_arch=${RUNNER_ARCH:-}"
            cat /etc/os-release
          } > "$ROOT/environment.txt"
          test "$(getconf PAGESIZE)" = "4096"
          test "$(stat -fc %T /sys/fs/cgroup)" = "cgroup2fs"
          test "$(nproc)" -ge 2
      - name: Run isolated passive block
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          python -m finite_ram_lab.memcg003b_nonconsuming run-block \
            --spec specs/MEMCG-003B-NONCONSUMING-SEVEN-SLOT-v1.json \
            --block "$BLOCK" \
            --worker "$GITHUB_WORKSPACE/build/memcg003_holder" \
            --out-root "$GITHUB_WORKSPACE/evidence/MEMCG-003B/block-$BLOCK"
      - uses: actions/upload-artifact@v7
        with:
          name: memcg003b-block-${{ matrix.block }}
          path: evidence/MEMCG-003B/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: block
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - uses: actions/download-artifact@v8
        with:
          pattern: memcg003b-block-*
          path: evidence/MEMCG-003B/input
      - name: Aggregate
        run: |
          mkdir -p evidence/MEMCG-003B/aggregate
          python -m finite_ram_lab.memcg003b_nonconsuming aggregate \
            --spec specs/MEMCG-003B-NONCONSUMING-SEVEN-SLOT-v1.json \
            --input-root evidence/MEMCG-003B/input \
            --json-out evidence/MEMCG-003B/aggregate/summary.json \
            --md-out evidence/MEMCG-003B/aggregate/summary.md
      - uses: actions/upload-artifact@v7
        with:
          name: MEMCG-003B-NONCONSUMING-${{ github.run_id }}
          path: evidence/MEMCG-003B/aggregate/
          if-no-files-found: error
          retention-days: 90
