name: B480 Baseline Decomposition

on:
  workflow_dispatch:
  push:
    branches:
      - research/baseline-decomposition-b480
    paths:
      - "src/finite_ram_lab/baseline_decomposition_probe.py"
      - "src/finite_ram_lab/baseline_decomposition_aggregate.py"
      - "tests/test_baseline_decomposition.py"
      - "docs/B480-BASELINE-DECOMPOSITION-v0.1.md"
      - ".github/workflows/b480-baseline-decomposition.yml"

permissions:
  contents: read

jobs:
  block:
    strategy:
      fail-fast: false
      matrix:
        block: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Run decomposition block
        run: |
          mkdir -p runs/B480
          python -m finite_ram_lab.baseline_decomposition_probe \
            --block-id ${{ matrix.block }} \
            --size 2048 \
            --out runs/B480/block-${{ matrix.block }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: b480-decomposition-block-${{ matrix.block }}
          path: runs/B480/block-${{ matrix.block }}.json
          if-no-files-found: error

  aggregate:
    needs: block
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Targeted tests
        run: python -m unittest tests.test_baseline_decomposition -v
      - uses: actions/download-artifact@v4
        with:
          pattern: b480-decomposition-block-*
          path: runs/B480/blocks
          merge-multiple: true
      - name: Aggregate decomposition
        run: |
          python -m finite_ram_lab.baseline_decomposition_aggregate \
            --blocks-dir runs/B480/blocks \
            --out runs/B480/baseline-decomposition.json
          python -m json.tool runs/B480/baseline-decomposition.json >/dev/null
          sha256sum runs/B480/baseline-decomposition.json
      - uses: actions/upload-artifact@v4
        with:
          name: b480-baseline-decomposition
          path: runs/B480/baseline-decomposition.json
          if-no-files-found: error
