name: FR-SOOM-002J Tiered Residency Planner

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-soom-002j-tiered-residency-planner
    paths:
      - "src/finite_ram_lab/semantic_tiered_residency.py"
      - "specs/FR-SOOM-002J.json"
      - "tests/test_semantic_tiered_residency.py"
      - "docs/FR-SOOM-002J-TIERED-RESIDENCY.md"
      - ".github/workflows/fr-soom-002j.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_semantic_tiered_residency -v
      - name: Run tiered residency panel
        run: |
          mkdir -p runs/FR-SOOM-002J
          python -m finite_ram_lab.semantic_tiered_residency > runs/FR-SOOM-002J/result.json
          python - <<'PY'
          import json
          r = json.load(open("runs/FR-SOOM-002J/result.json"))
          assert r["status"] == "PASS"
          a = r["arms"]
          assert a["FAST_SSD_TIERED"]["choices"]["KV"] == "Q8"
          assert a["FAST_SSD_TIERED"]["choices"]["AUX_EXPERTS"] == "SSD"
          assert a["FAST_SSD_TIERED"]["choices"]["ACTIVE_TASK"] == "KEEP"
          assert a["RAM_ONLY"]["semantic_loss"] == 45
          assert a["FAST_SSD_TIERED"]["semantic_loss"] == 12
          assert a["SLOW_SSD_TIERED"]["choices"] == a["RAM_ONLY"]["choices"]
          assert a["EMERGENCY_SHORT_DEADLINE"]["choices"] == a["RAM_ONLY"]["choices"]
          PY
          sha256sum specs/FR-SOOM-002J.json
          sha256sum runs/FR-SOOM-002J/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-soom-002j-tiered-residency
          path: runs/FR-SOOM-002J/result.json
          if-no-files-found: error
