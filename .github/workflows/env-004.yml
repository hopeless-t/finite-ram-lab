name: ENV-004 Proactive Reclaim Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/env-004.yml"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Build schedule
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          mkdir -p "evidence/ENV-004/block-${BLOCK}/raw"
          python -m finite_ram_lab.env004_study schedule \
            --spec specs/ENV-004.json \
            --block "$BLOCK" \
            --out "evidence/ENV-004/block-${BLOCK}/schedule.csv"
      - name: Run capability block
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          HIGH=$((512 * 1024 * 1024))
          MAX=$((768 * 1024 * 1024))
          SCHEDULE="evidence/ENV-004/block-${BLOCK}/schedule.csv"
          tail -n +2 "$SCHEDULE" | while IFS=, read -r ORDER ARM REPEAT; do
            UNIT="finite-ram-env004-${GITHUB_RUN_ID}-${BLOCK}-${ORDER}"
            OUT="$GITHUB_WORKSPACE/evidence/ENV-004/block-${BLOCK}/raw/trial-${ORDER}-${ARM}-rep${REPEAT}.json"
            sudo systemd-run \
              --pipe --wait --collect --quiet \
              --unit="$UNIT" \
              -p MemoryAccounting=yes \
              -p MemoryHigh="$HIGH" \
              -p MemoryMax="$MAX" \
              "$PY" -m finite_ram_lab.env004_probe \
                --arm "$ARM" \
                --region-mib 32 \
                --pageout-mib 16 \
                --reclaim-mib 16 \
                --out "$OUT" >/dev/null
          done
          sudo chown -R "$(id -u):$(id -g)" "evidence/ENV-004/block-${BLOCK}"
      - uses: actions/upload-artifact@v4
        with:
          name: env004-block-${{ matrix.block }}
          path: evidence/ENV-004/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: block
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - uses: actions/download-artifact@v4
        with:
          pattern: env004-block-*
          path: evidence/ENV-004
      - name: Aggregate
        run: |
          python -m finite_ram_lab.env004_study aggregate \
            --spec specs/ENV-004.json \
            --input-root evidence/ENV-004 \
            --out-dir evidence/ENV-004/aggregate
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s=json.load(open('evidence/ENV-004/aggregate/summary.json'))
          print('# ENV-004')
          print()
          print(f"Execution: **{s['execution_status']}**")
          print()
          print('| Arm | Trials | Target drop | Control drop | Target-control | Target retouch ms |')
          print('| --- | ---: | ---: | ---: | ---: | ---: |')
          for arm, a in s['arm_summary'].items():
              print(f"| {arm} | {a['trials']} | {a['median_target_drop']:.3f} | {a['median_control_drop']:.3f} | {a['median_target_minus_control_drop']:.3f} | {a['median_target_retouch_ms']:.3f} |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ENV-004-aggregate-${{ github.run_id }}
          path: evidence/ENV-004/aggregate/
          if-no-files-found: error
          retention-days: 90
