name: FR-P9-019 Service Curve Epoch Replan

on:
  push:
    branches:
      - research/fr-p9-019-service-curve-epoch-replan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted epoch-guard tests
        run: python -m unittest tests.test_fr_p9_019_service_curve_epoch_replan -v
      - name: Run controlled epoch-switch physical falsifier
        run: |
          mkdir -p runs/FR-P9-019
          set +e
          python -m finite_ram_lab.fr_p9_019_service_curve_epoch_replan --repetitions 3 > runs/FR-P9-019/result.json
          rc=$?
          set -e
          echo "$rc" > runs/FR-P9-019/exit-code.txt
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fr-p9-019-service-curve-epoch-replan
          path: |
            runs/FR-P9-019/result.json
            runs/FR-P9-019/exit-code.txt
          if-no-files-found: error
