name: STRATA-002 Pilot v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/strata-002-pilot.yml"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - name: Prepare cold file outside trial cgroups
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from finite_ram_lab.strata001_probe import _prepare_file
          p = Path(os.environ["RUNNER_TEMP"]) / "strata002-pilot-cold.bin"
          _prepare_file(p, 96 * 1024 * 1024, 4 * 1024 * 1024)
          print(p)
          PY

      - name: Build pilot schedule
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          mkdir -p "evidence/STRATA-002-PILOT/block-${BLOCK}/raw"
          python -m finite_ram_lab.strata002_pilot_study schedule \
            --spec specs/STRATA-002-PILOT-v1.json \
            --block "${BLOCK}" \
            --out "evidence/STRATA-002-PILOT/block-${BLOCK}/schedule.csv"

      - name: Run advisory cold-stream pilot
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          HIGH_BYTES=$((160 * 1024 * 1024))
          MAX_BYTES=$((320 * 1024 * 1024))
          FILE="$RUNNER_TEMP/strata002-pilot-cold.bin"
          SCHEDULE="evidence/STRATA-002-PILOT/block-${BLOCK}/schedule.csv"

          tail -n +2 "$SCHEDULE" | while IFS=, read -r ORDER ARM; do
            UNIT="finite-ram-strata002-${GITHUB_RUN_ID}-${BLOCK}-${ORDER}"
            OUT="$GITHUB_WORKSPACE/evidence/STRATA-002-PILOT/block-${BLOCK}/raw/trial-${ORDER}-${ARM}.json"

            sudo systemd-run \
              --pipe --wait --collect --quiet \
              --unit="$UNIT" \
              -p MemoryAccounting=yes \
              -p MemoryHigh="$HIGH_BYTES" \
              -p MemoryMax="$MAX_BYTES" \
              "$PY" -m finite_ram_lab.strata002_pilot_workload \
                --arm "$ARM" \
                --file "$FILE" \
                --hot-anon-mib 64 \
                --buffer-mib 4 \
                --expected-file-mib 96 \
                --expected-high-bytes "$HIGH_BYTES" \
                --expected-max-bytes "$MAX_BYTES" \
                --precache-limit 0.10 \
                --out "$OUT" >/dev/null
          done

          sudo chown -R "$(id -u):$(id -g)" "evidence/STRATA-002-PILOT/block-${BLOCK}"

      - uses: actions/upload-artifact@v7
        with:
          name: strata002-pilot-block-${{ matrix.block }}
          path: evidence/STRATA-002-PILOT/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: block
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - uses: actions/download-artifact@v8
        with:
          pattern: strata002-pilot-block-*
          path: evidence/STRATA-002-PILOT

      - name: Aggregate pilot
        run: |
          python -m finite_ram_lab.strata002_pilot_study aggregate \
            --spec specs/STRATA-002-PILOT-v1.json \
            --input-root evidence/STRATA-002-PILOT \
            --out-dir evidence/STRATA-002-PILOT/aggregate

      - name: Job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s=json.load(open("evidence/STRATA-002-PILOT/aggregate/summary.json"))
          print("# STRATA-002 Pilot v1")
          print()
          print("Ordinary buffered I/O vs Linux cold-stream advice vs O_DIRECT reference.")
          print()
          print(f"Execution status: **{s['execution_status']}**")
          print()
          print("| Arm | high events | memory.current MiB | file residency | scan ms |")
          print("| --- | ---: | ---: | ---: | ---: |")
          for arm in ("buffered", "buffered_noreuse", "buffered_dontneed", "direct"):
              c=s["cells"][arm]
              print(
                  f"| {arm} | {c['median_memory_high_events']:.1f} | "
                  f"{c['median_memory_current_mib']:.2f} | "
                  f"{c['median_file_post_fraction']:.4f} | "
                  f"{c['median_scan_ms']:.2f} |"
              )
          print()
          print("Pilot only: no production recommendation is authorized.")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: STRATA-002-PILOT-${{ github.run_id }}
          path: evidence/STRATA-002-PILOT/aggregate/
          if-no-files-found: error
          retention-days: 90
