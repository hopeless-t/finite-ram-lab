name: ENV-004 Proactive Reclaim Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/env-004.yml"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Run prepared-range reclaim probes
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          mkdir -p "evidence/ENV-004/block-${BLOCK}"
          PY="$(command -v python)"
          if (( BLOCK % 2 == 0 )); then TARGETS="A B"; else TARGETS="B A"; fi
          for TARGET in $TARGETS; do
            UNIT="finite-ram-env004-${GITHUB_RUN_ID}-${BLOCK}-${TARGET}"
            OUT="$GITHUB_WORKSPACE/evidence/ENV-004/block-${BLOCK}/probe-${TARGET}.json"
            sudo systemd-run \
              --pipe --wait --collect --quiet \
              --unit="$UNIT" \
              -p MemoryAccounting=yes \
              -p MemoryHigh=$((256 * 1024 * 1024)) \
              -p MemoryMax=$((320 * 1024 * 1024)) \
              "$PY" -m finite_ram_lab.reclaim_probe \
                --target-identity "$TARGET" \
                --region-mib 16 \
                --reclaim-mib 16 \
                --post-pageout-wait-ms 100 \
                --post-reclaim-wait-ms 100 \
                --out "$OUT"
          done
          sudo chown -R "$(id -u):$(id -g)" "evidence/ENV-004/block-${BLOCK}"
      - uses: actions/upload-artifact@v4
        with:
          name: env004-block-${{ matrix.block }}
          path: evidence/ENV-004/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: block
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: env004-block-*
          path: evidence/ENV-004
      - name: Classify instrument
        run: |
          python - <<'PY'
          import glob,json,statistics,pathlib
          files=sorted(glob.glob('evidence/ENV-004/*/probe-*.json'))
          rows=[json.load(open(p)) for p in files]
          tf=[r['derived']['target_resident_fraction_after_reclaim'] for r in rows]
          cf=[r['derived']['control_resident_fraction_after_reclaim'] for r in rows]
          sg=[r['derived']['selectivity_gap'] for r in rows]
          all_pageout=all(r['pageout']['success'] for r in rows)
          all_content=all(r['content_match'] for r in rows)
          no_oom=all(r['checks']['no_oom'] for r in rows)
          if not all_pageout:
              classification='UNAVAILABLE'
          elif statistics.median(tf) <= 0.50 and min(cf) >= 0.90 and all_content:
              classification='SELECTIVE'
          elif statistics.median(tf) <= 0.50:
              classification='NONSELECTIVE'
          else:
              classification='INEFFECTIVE'
          out={
            'experiment_id':'ENV-004',
            'trials':len(rows),
            'classification':classification,
            'all_pageout_success':all_pageout,
            'reclaim_success_rate':sum(bool(r['reclaim']['success']) for r in rows)/len(rows),
            'all_content_match':all_content,
            'no_oom':no_oom,
            'median_target_fraction_after_reclaim':statistics.median(tf),
            'min_target_fraction_after_reclaim':min(tf),
            'max_target_fraction_after_reclaim':max(tf),
            'median_control_fraction_after_reclaim':statistics.median(cf),
            'min_control_fraction_after_reclaim':min(cf),
            'median_selectivity_gap':statistics.median(sg),
            'median_swap_growth_after_pageout_mib':statistics.median(r['derived']['swap_growth_after_pageout_mib'] for r in rows),
            'median_swap_growth_after_reclaim_mib':statistics.median(r['derived']['swap_growth_after_reclaim_mib'] for r in rows),
            'median_target_retouch_ms':statistics.median(r['retouch_ns']['target']/1e6 for r in rows),
            'median_control_retouch_ms':statistics.median(r['retouch_ns']['control']/1e6 for r in rows),
          }
          pathlib.Path('evidence/ENV-004/aggregate').mkdir(parents=True,exist_ok=True)
          pathlib.Path('evidence/ENV-004/aggregate/summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Summary
        run: cat evidence/ENV-004/aggregate/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ENV-004-aggregate-${{ github.run_id }}
          path: evidence/ENV-004/aggregate/
          if-no-files-found: error
          retention-days: 90
