name: Premeasurement Q64 callpath

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launch/TX-PREMEASURE-Q64-CALLPATH-v1.txt"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - name: Compile worker
        run: |
          mkdir -p build
          gcc -O2 -Wall -Wextra -std=c11             experiments/tx_perturbation_worker.c             -o build/tx_perturbation_worker

      - name: Environment gate
        run: |
          set -euo pipefail
          test "$(getconf PAGESIZE)" = "4096"
          test "$(stat -fc %T /sys/fs/cgroup)" = "cgroup2fs"
          test "$(nproc)" -ge 3
          uname -a

      - name: Run callpath block
        env:
          BLOCK: "${{ matrix.block }}"
        run: |
          set -euo pipefail
          TRACE=/sys/kernel/tracing
          OUT="$GITHUB_WORKSPACE/evidence/PREMEASURE-Q64-CALLPATH/block-$BLOCK"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          if ! mountpoint -q "$TRACE"; then
            sudo mount -t tracefs nodev "$TRACE"
          fi

          cleanup() (
            set +e
            echo 0 | sudo tee "$TRACE/tracing_on" >/dev/null 2>&1
            if test -e "$TRACE/events/kprobes/frl_pc_try64/enable"; then
              echo 0 | sudo tee "$TRACE/events/kprobes/frl_pc_try64/enable" >/dev/null 2>&1
            fi
            if test -e "$TRACE/events/kprobes/frl_pc_try64/trigger"; then
              echo '!stacktrace' | sudo tee "$TRACE/events/kprobes/frl_pc_try64/trigger" >/dev/null 2>&1
            fi
            printf '%s\n' '-:frl_pc_try64'               | sudo tee -a "$TRACE/kprobe_events" >/dev/null 2>&1
            true
          )
          trap cleanup EXIT
          cleanup

          printf '%s\n'             'p:frl_pc_try64 page_counter_try_charge counter=$arg1:x64 nr_pages=$arg2:u64 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null

          echo 'nr_pages == 64 && common_pid == 0'             | sudo tee "$TRACE/events/kprobes/frl_pc_try64/filter" >/dev/null
          sudo cat "$TRACE/events/kprobes/frl_pc_try64/format"             > "$OUT/frl_pc_try64.format"

          RUNNER_UID="$(id -u)"
          PYTHON_BIN="$(command -v python)"
          echo 65536 | sudo tee "$TRACE/buffer_size_kb" >/dev/null
          echo 0 | sudo tee "$TRACE/tracing_on" >/dev/null
          echo | sudo tee "$TRACE/trace" >/dev/null
          echo 1 | sudo tee "$TRACE/tracing_on" >/dev/null

          sudo -E "$PYTHON_BIN"             -m finite_ram_lab.premeasure_q64_callpath run-block             --spec "$GITHUB_WORKSPACE/specs/TX-PREMEASURE-Q64-CALLPATH-v1.json"             --block "$BLOCK"             --worker "$GITHUB_WORKSPACE/build/tx_perturbation_worker"             --out-root "$OUT"             --trace-marker "$TRACE/trace_marker"             --trace-path "$TRACE/trace"             --worker-uid "$RUNNER_UID"

          echo 0 | sudo tee "$TRACE/tracing_on" >/dev/null
          sudo cat "$TRACE/trace" > "$OUT/trace.log"
          sudo cat "$TRACE/kprobe_profile" > "$OUT/kprobe-profile.txt" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: premeasure-callpath-block-${{ matrix.block }}
          path: evidence/PREMEASURE-Q64-CALLPATH/block-${{ matrix.block }}/
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    needs: block
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - uses: actions/download-artifact@v8
        with:
          pattern: premeasure-callpath-block-*
          path: evidence/PREMEASURE-Q64-CALLPATH/input

      - name: Aggregate
        run: |
          mkdir -p evidence/PREMEASURE-Q64-CALLPATH/aggregate
          python -m finite_ram_lab.premeasure_q64_callpath aggregate             --spec specs/TX-PREMEASURE-Q64-CALLPATH-v1.json             --input-root evidence/PREMEASURE-Q64-CALLPATH/input             --json-out evidence/PREMEASURE-Q64-CALLPATH/aggregate/summary.json

      - name: Freeze raw evidence manifest
        run: |
          frl evidence-manifest             evidence/PREMEASURE-Q64-CALLPATH/input             --out evidence/PREMEASURE-Q64-CALLPATH/aggregate/full-raw-evidence-manifest.json             --experiment-id TX-PREMEASURE-Q64-CALLPATH-v1             --run-id "$GITHUB_RUN_ID"             --source-commit "$GITHUB_SHA"             --tier HOT             --origin-provider github-actions             --origin-ref "run:$GITHUB_RUN_ID"

      - name: Verify raw evidence
        run: |
          frl evidence-verify             evidence/PREMEASURE-Q64-CALLPATH/input             --manifest evidence/PREMEASURE-Q64-CALLPATH/aggregate/full-raw-evidence-manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: TX-PREMEASURE-Q64-CALLPATH-${{ github.run_id }}
          path: evidence/PREMEASURE-Q64-CALLPATH/aggregate/
          if-no-files-found: error
          retention-days: 30

      - name: Assert callpath experiment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("evidence/PREMEASURE-Q64-CALLPATH/aggregate/summary.json")
          result = json.loads(p.read_text())
          print(json.dumps({
              "experiment_pass": result["experiment_pass"],
              "coverage_pass": result["coverage_pass"],
              "stack_receipt_complete": result["stack_receipt_complete"],
              "single_process_all": result["single_process_all"],
              "bound_violation_count": result["bound_violation_count"],
              "classifications": result["classifications"],
              "premeasurement_q64_event_count": result[
                  "premeasurement_q64_event_count"
              ],
              "by_settle_ms": result["by_settle_ms"],
              "callpath_fingerprints": result[
                  "callpath_fingerprints"
              ],
          }, sort_keys=True))
          if not result["experiment_pass"]:
              raise SystemExit("premeasurement callpath experiment did not pass")
          PY
