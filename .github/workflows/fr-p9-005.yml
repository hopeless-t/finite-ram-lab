name: FR-P9-005 Concurrency Frontier

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-p9-005-concurrency-frontier
    paths:
      - "src/finite_ram_lab/fr_p9_005_concurrency_frontier.py"
      - "tests/test_fr_p9_005_concurrency_frontier.py"
      - "specs/FR-P9-005.json"
      - "docs/FR-P9-005-CONCURRENCY-FRONTIER.md"
      - ".github/workflows/fr-p9-005.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_fr_p9_005_concurrency_frontier -v
      - name: Run hosted concurrency proxy
        run: |
          mkdir -p runs/FR-P9-005
          python -m finite_ram_lab.fr_p9_005_concurrency_frontier \
            --physical --payload-mib 4 --jobs 12 --rounds 8 --repetitions 2 \
            > runs/FR-P9-005/result.json
          python - <<'PY'
          import json
          r = json.load(open("runs/FR-P9-005/result.json"))
          assert r["status"] == "PASS"
          assert r["authority_effect"] == "NONE"
          assert r["scalar_gain"] is None
          assert r["probe"]["worker_counts"] == [1, 2, 4]
          assert r["probe"]["jobs"] == 12
          assert r["probe"]["repetitions"] == 2
          assert r["checks"]["semantic_results_stable_across_repetitions"] is True
          assert r["checks"]["semantic_results_stable_across_worker_counts"] is True
          assert len(r["pareto_worker_counts"]) >= 1
          PY
          sha256sum specs/FR-P9-005.json
          sha256sum runs/FR-P9-005/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-p9-005-concurrency-frontier
          path: runs/FR-P9-005/result.json
          if-no-files-found: error
