name: CHAR-001 Pressure Sweep

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/char-001.yml"
      - "src/finite_ram_lab/char_sweep.py"
      - "src/finite_ram_lab/obs_workload.py"
      - "src/finite_ram_lab/calculators.py"
      - "specs/CHAR-001.json"
      - "docs/CHAR-001.md"

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install research toolbox
        run: python -m pip install -e ".[analysis]"

      - name: Build deterministic sweep schedule
        run: |
          mkdir -p evidence/CHAR-001/raw
          python -m finite_ram_lab.char_sweep schedule \
            --spec specs/CHAR-001.json \
            --out evidence/CHAR-001/schedule.csv
          cat evidence/CHAR-001/schedule.csv

      - name: Execute isolated pressure sweep
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          MAX_BYTES=$((320 * 1024 * 1024))
          tail -n +2 evidence/CHAR-001/schedule.csv | \
          while IFS=, read -r ORDER REPEAT HIGH_MIB; do
            HIGH_BYTES=$((HIGH_MIB * 1024 * 1024))
            UNIT="finite-ram-char001-${GITHUB_RUN_ID}-${ORDER}"
            OUT="$GITHUB_WORKSPACE/evidence/CHAR-001/raw/timeline-${ORDER}-high${HIGH_MIB}-rep${REPEAT}.json"
            LOG="$GITHUB_WORKSPACE/evidence/CHAR-001/raw/stdout-${ORDER}-high${HIGH_MIB}-rep${REPEAT}.txt"
            sudo systemd-run \
              --pipe --wait --collect --quiet \
              --unit="$UNIT" \
              -p MemoryAccounting=yes \
              -p MemoryHigh="$HIGH_BYTES" \
              -p MemoryMax="$MAX_BYTES" \
              "$PY" -m finite_ram_lab.obs_workload \
                --hotset-mib 64 \
                --burst-mib 96 \
                --expected-high-bytes "$HIGH_BYTES" \
                --expected-max-bytes "$MAX_BYTES" \
                --out "$OUT" \
              > "$LOG"
            sleep 0.05
          done
          sudo chown -R "$(id -u):$(id -g)" evidence/CHAR-001

      - name: Aggregate and validate
        run: |
          python -m finite_ram_lab.char_sweep aggregate \
            --spec specs/CHAR-001.json \
            --input-dir evidence/CHAR-001/raw \
            --trials-out evidence/CHAR-001/trials.csv \
            --summary-out evidence/CHAR-001/summary.csv \
            --meta-out evidence/CHAR-001/meta.json

      - name: Run changepoint calculator
        run: |
          cat > evidence/CHAR-001/changepoint-spec.json <<'JSON'
          {
            "task_id": "CHAR-001-CHANGEPOINT",
            "tool": "changepoint",
            "input": "summary.csv",
            "params": {
              "x": "memory_high_mib",
              "y": "median_hotset_retouch_ms",
              "min_segment": 3
            }
          }
          JSON
          frl run-spec evidence/CHAR-001/changepoint-spec.json \
            --out evidence/CHAR-001/changepoint.json

      - name: Job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          import json

          rows = list(csv.DictReader(open('evidence/CHAR-001/summary.csv')))
          cp = json.load(open('evidence/CHAR-001/changepoint.json'))['result']

          print('# CHAR-001')
          print()
          print('| MemoryHigh MiB | Median retouch ms | P90 ms | Median swap MiB | High events | pgscan | pgsteal |')
          print('| ---: | ---: | ---: | ---: | ---: | ---: | ---: |')
          for r in rows:
              print(
                  f"| {float(r['memory_high_mib']):.0f} "
                  f"| {float(r['median_hotset_retouch_ms']):.3f} "
                  f"| {float(r['p90_hotset_retouch_ms']):.3f} "
                  f"| {float(r['median_swap_growth_mib']):.3f} "
                  f"| {float(r['median_high_events_delta']):.0f} "
                  f"| {float(r['median_pgscan_delta']):.0f} "
                  f"| {float(r['median_pgsteal_delta']):.0f} |"
              )
          print()
          print('## Changepoint aid')
          print()
          print(f"Breakpoint estimate: **{cp['breakpoint']:.1f} MiB**")
          print(f"Delta BIC (baseline - segmented): **{cp['delta_bic_baseline_minus_segmented']:.3f}**")
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: CHAR-001-${{ github.run_id }}
          path: evidence/CHAR-001/
          if-no-files-found: error
          retention-days: 90
