name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Monte Carlo smoke test
        run: |
          mkdir -p runs/MC-001
          python -m finite_ram_lab.mc \
            --family stable_hotset \
            --seed 20260926 \
            --trials 25 \
            --out runs/MC-001/smoke.json

      - name: Environment probe smoke test
        run: |
          mkdir -p runs/ENV-001
          python -m finite_ram_lab.env_probe \
            --out runs/ENV-001/probe.json >/dev/null
          python -m json.tool runs/ENV-001/probe.json >/dev/null
