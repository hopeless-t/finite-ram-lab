name: FR-CLM-001B Stochastic Rare Events

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-clm-001b-stochastic-rare-events
    paths:
      - "src/finite_ram_lab/stochastic_semantic_working_set.py"
      - "src/finite_ram_lab/semantic_working_set.py"
      - "specs/FR-CLM-001B.json"
      - "tests/test_stochastic_semantic_working_set.py"
      - "docs/FR-CLM-001B-STOCHASTIC-RARE-EVENTS.md"
      - ".github/workflows/fr-clm-001b.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_stochastic_semantic_working_set -v
      - name: Run stochastic panel
        run: |
          mkdir -p runs/FR-CLM-001B
          python -m finite_ram_lab.stochastic_semantic_working_set \
            > runs/FR-CLM-001B/result.json
          python - <<'PY'
          import json
          r=json.load(open("runs/FR-CLM-001B/result.json"))
          assert r["status"] == "PASS"
          assert r["qualified_knees"]["APPEND_TRUNCATE"] == 8
          assert r["qualified_knees"]["NOISY_KEY_AWARE"] == 2
          assert r["rare_event_probe"]["failure_count"] == 17
          assert r["empirical_model_claim"] is False
          PY
          sha256sum specs/FR-CLM-001B.json
          sha256sum runs/FR-CLM-001B/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-clm-001b-stochastic-rare-events
          path: runs/FR-CLM-001B/result.json
          if-no-files-found: error
