name: FR-P9-023 Prefix Streaming Release

on:
  push:
    branches:
      - research/fr-p9-023-prefix-streaming-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted prefix-release tests
        run: python -m unittest tests.test_fr_p9_023_prefix_streaming_release -v
      - name: Run physical prefix-streaming falsifier
        run: |
          mkdir -p runs/FR-P9-023
          set +e
          python -m finite_ram_lab.fr_p9_023_prefix_streaming_release --repetitions 3 > runs/FR-P9-023/result.json
          rc=$?
          set -e
          echo "$rc" > runs/FR-P9-023/exit-code.txt
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fr-p9-023-prefix-streaming-release
          path: |
            runs/FR-P9-023/result.json
            runs/FR-P9-023/exit-code.txt
          if-no-files-found: error
