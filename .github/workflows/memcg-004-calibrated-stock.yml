name: MEMCG-004 Calibrated Stock v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["launch/MEMCG-004-v1.txt"]

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Compile zero-touch worker
        run: |
          mkdir -p build
          gcc -O2 -Wall -Wextra -std=c11 experiments/memcg004_worker.c -o build/memcg004_worker
      - name: Environment receipt
        run: |
          test "$(getconf PAGESIZE)" = "4096"
          test "$(stat -fc %T /sys/fs/cgroup)" = "cgroup2fs"
          test "$(nproc)" -ge 2
      - name: Run calibrated block
        env: {BLOCK: "${{ matrix.block }}"}
        run: |
          python -m finite_ram_lab.memcg004_runner run-block \
            --spec specs/MEMCG-004-CALIBRATED-STOCK-v1.json \
            --block "$BLOCK" --worker "$GITHUB_WORKSPACE/build/memcg004_worker" \
            --out-root "$GITHUB_WORKSPACE/evidence/MEMCG-004/block-$BLOCK"
      - uses: actions/upload-artifact@v7
        with:
          name: memcg004-block-${{ matrix.block }}
          path: evidence/MEMCG-004/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: block
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - uses: actions/download-artifact@v8
        with:
          pattern: memcg004-block-*
          path: evidence/MEMCG-004/input
      - name: Aggregate
        run: |
          python -m finite_ram_lab.memcg004_runner aggregate \
            --spec specs/MEMCG-004-CALIBRATED-STOCK-v1.json \
            --input-root evidence/MEMCG-004/input \
            --json-out evidence/MEMCG-004/aggregate/summary.json
      - uses: actions/upload-artifact@v7
        with:
          name: MEMCG-004-CALIBRATED-STOCK-${{ github.run_id }}
          path: evidence/MEMCG-004/aggregate/
          if-no-files-found: error
          retention-days: 90
