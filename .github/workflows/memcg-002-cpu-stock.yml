name: MEMCG-002 CPU Stock Causal v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "launch/MEMCG-002-v1.txt"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Compile worker
        run: |
          mkdir -p build
          gcc -O2 -Wall -Wextra -std=c11 -D_GNU_SOURCE \
            experiments/memcg002_worker.c \
            -o build/memcg002_worker
      - name: Choose CPUs and build schedule
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          read CPU_A CPU_B < <(python - <<'PY'
          import os
          cpus=sorted(os.sched_getaffinity(0))
          if len(cpus) < 2:
              raise SystemExit("need at least two allowed CPUs")
          print(cpus[0], cpus[1])
          PY
          )
          taskset -c "$CPU_A" true
          taskset -c "$CPU_B" true
          echo "CPU_A=$CPU_A" >> "$GITHUB_ENV"
          echo "CPU_B=$CPU_B" >> "$GITHUB_ENV"

          ROOT="evidence/MEMCG-002/block-${BLOCK}"
          mkdir -p "${ROOT}/raw"
          python -m finite_ram_lab.memcg002_cpu_stock schedule \
            --spec specs/MEMCG-002-CPU-STOCK-CAUSAL-v1.json \
            --block "${BLOCK}" \
            --out "${ROOT}/schedule.csv"

          {
            echo "kernel_release=$(uname -r)"
            echo "systemd_version=$(systemd-run --version | head -n1)"
            echo "cgroup_fs_type=$(stat -fc %T /sys/fs/cgroup)"
            echo "page_size=$(getconf PAGESIZE)"
            echo "cpu_a=$CPU_A"
            echo "cpu_b=$CPU_B"
            echo "allowed_cpus=$(python -c 'import os; print(sorted(os.sched_getaffinity(0)))')"
            echo "image_os=${ImageOS:-}"
            echo "image_version=${ImageVersion:-}"
            echo "runner_arch=${RUNNER_ARCH:-}"
            cat /etc/os-release
          } > "${ROOT}/environment.txt"

          test "$(getconf PAGESIZE)" = "4096"
          test "$(stat -fc %T /sys/fs/cgroup)" = "cgroup2fs"
      - name: Run causal arms
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/evidence/MEMCG-002/block-${BLOCK}"
          WORKER="$GITHUB_WORKSPACE/build/memcg002_worker"

          tail -n +2 "${ROOT}/schedule.csv" | while IFS=, read -r ORDER ARM; do
            UNIT="finite-ram-memcg002-${GITHUB_RUN_ID}-${BLOCK}-${ORDER}"
            OUT="${ROOT}/raw/trial-${BLOCK}-${ORDER}-${ARM}.csv"
            sudo systemd-run \
              --pipe --wait --collect --quiet \
              --unit="$UNIT" \
              -p MemoryAccounting=yes \
              -p "CPUAffinity=$CPU_A" \
              "$WORKER" \
                --arm "$ARM" \
                --cpu-a "$CPU_A" \
                --cpu-b "$CPU_B" \
                --steps 256 \
                --migrate-after 128 \
                --return-after 192 > "$OUT"
          done
          sudo chown -R "$(id -u):$(id -g)" "${ROOT}"
      - uses: actions/upload-artifact@v7
        with:
          name: memcg002-block-${{ matrix.block }}
          path: evidence/MEMCG-002/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: block
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - uses: actions/download-artifact@v8
        with:
          pattern: memcg002-block-*
          path: evidence/MEMCG-002/input
      - name: Aggregate causal analysis
        run: |
          mkdir -p evidence/MEMCG-002/aggregate
          python -m finite_ram_lab.memcg002_cpu_stock aggregate \
            --spec specs/MEMCG-002-CPU-STOCK-CAUSAL-v1.json \
            --input-root evidence/MEMCG-002/input \
            --json-out evidence/MEMCG-002/aggregate/summary.json \
            --md-out evidence/MEMCG-002/aggregate/summary.md
      - uses: actions/upload-artifact@v7
        with:
          name: MEMCG-002-CPU-STOCK-${{ github.run_id }}
          path: evidence/MEMCG-002/aggregate/
          if-no-files-found: error
          retention-days: 90
