name: OBS-001

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/obs-001.yml"
      - "src/finite_ram_lab/obs_workload.py"
      - "specs/OBS-001.json"
      - "docs/OBS-001.md"

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Run synchronized observation workload
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence/OBS-001"
          PY="$(command -v python)"
          UNIT="finite-ram-obs001-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo systemd-run \
            --pipe --wait --collect --quiet \
            --unit="$UNIT" \
            -p MemoryAccounting=yes \
            -p MemoryHigh=167772160 \
            -p MemoryMax=268435456 \
            "$PY" -m finite_ram_lab.obs_workload \
              --hotset-mib 64 \
              --burst-mib 96 \
              --expected-high-bytes 167772160 \
              --expected-max-bytes 268435456 \
              --out "$GITHUB_WORKSPACE/evidence/OBS-001/timeline.json"
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/evidence/OBS-001"

      - name: Validate evidence
        run: |
          python -m json.tool evidence/OBS-001/timeline.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('evidence/OBS-001/timeline.json'))
          assert d['status'] == 'PASS', d
          print('phase,memory_current,swap_current,high_events')
          for e in d['timeline']:
              print(e['phase'], e['os']['memory_current'], e['os']['memory_swap_current'], e['os']['memory_events'].get('high',0), sep=',')
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: OBS-001-${{ github.run_id }}
          path: evidence/OBS-001/
          if-no-files-found: error
          retention-days: 30
