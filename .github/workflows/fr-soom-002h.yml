name: FR-SOOM-002H Regime Drift

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-soom-002h-regime-drift
    paths:
      - "src/finite_ram_lab/semantic_oom_regime_drift.py"
      - "specs/FR-SOOM-002H.json"
      - "tests/test_semantic_oom_regime_drift.py"
      - "docs/FR-SOOM-002H-REGIME-DRIFT.md"
      - ".github/workflows/fr-soom-002h.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_semantic_oom_regime_drift -v
      - name: Run regime-drift panel
        run: |
          mkdir -p runs/FR-SOOM-002H
          python -m finite_ram_lab.semantic_oom_regime_drift \
            > runs/FR-SOOM-002H/result.json
          python - <<'PY'
          import json
          r=json.load(open("runs/FR-SOOM-002H/result.json"))
          assert r["status"] == "PASS"
          s=r["strategies"]
          assert s["STATIC_INITIAL"]["current_task_loss_count"] == 101
          assert s["RAW_SLIDING"]["current_task_loss_count"] == 41
          assert s["RAW_SLIDING"]["plan_switches"] == 4
          assert s["HYSTERESIS_2_ENTER_1_EXIT"]["current_task_loss_count"] == 61
          assert s["HYSTERESIS_2_ENTER_1_EXIT"]["plan_switches"] == 2
          assert s["HYSTERESIS_2_ENTER_1_EXIT"]["unnecessary_background_sacrifice_windows"] == 1
          PY
          sha256sum specs/FR-SOOM-002H.json
          sha256sum runs/FR-SOOM-002H/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-soom-002h-regime-drift
          path: runs/FR-SOOM-002H/result.json
          if-no-files-found: error
