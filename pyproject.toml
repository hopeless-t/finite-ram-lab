[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finite-ram-lab"
version = "0.2.0"
description = "Reproducible systems research on finite physical memory."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "statsmodels>=0.14"
]

[project.scripts]
frl = "finite_ram_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
