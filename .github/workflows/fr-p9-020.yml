name: FR-P9-020 Multi Resource Service Conjunction

on:
  push:
    branches:
      - research/fr-p9-020-multi-resource-service-conjunction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted typed-conjunction tests
        run: python -m unittest tests.test_fr_p9_020_multi_resource_service_conjunction -v
      - name: Run analytic qualification
        run: |
          mkdir -p runs/FR-P9-020
          python -m finite_ram_lab.fr_p9_020_multi_resource_service_conjunction \
            --seed 20261008 --trials 5000 > runs/FR-P9-020/result.json
          python - <<'PY'
          import json
          r = json.load(open("runs/FR-P9-020/result.json"))
          assert r["status"] == "PASS"
          assert r["exhaustive"]["mismatches"] == 0
          assert r["monte_carlo"]["naive_scalar_false_admits"] > 0
          assert r["monte_carlo"]["typed_false_admits"] == 0
          assert r["partial_stale_adversary"]["status"] == "REPLAN_REQUIRED"
          assert r["scalarization_adversary"]["typed_conjunction_status"] == "INSUFFICIENT_TYPED_RESOURCE_SERVICE"
          assert r["authority_effect"] == "NONE"
          assert r["retry_authority"] is False
          assert r["scalar_gain"] is None
          assert all(r["checks"].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fr-p9-020-multi-resource-service-conjunction
          path: runs/FR-P9-020/result.json
          if-no-files-found: error
