name: FR-P9-007 Hosted Joint Frontier

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-p9-007-hosted-joint-frontier
    paths:
      - "src/finite_ram_lab/fr_p9_007_hosted_joint_frontier.py"
      - "tests/test_fr_p9_007_hosted_joint_frontier.py"
      - "specs/FR-P9-007.json"
      - "docs/FR-P9-007-HOSTED-JOINT-FRONTIER.md"
      - ".github/workflows/fr-p9-007.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_fr_p9_007_hosted_joint_frontier -v
      - name: Run same-surface joint proxy
        run: |
          mkdir -p runs/FR-P9-007
          python -m finite_ram_lab.fr_p9_007_hosted_joint_frontier \
            --physical --payload-mib 8 --jobs 12 --rounds 6 \
            --repetitions 2 --idle-gap-seconds 0.20 \
            > runs/FR-P9-007/result.json
          python - <<'PY'
          import json
          r = json.load(open("runs/FR-P9-007/result.json"))
          assert r["status"] == "PASS"
          assert r["authority_effect"] == "NONE"
          assert r["scalar_gain"] is None
          assert r["probe"]["worker_counts"] == [1, 2, 4]
          assert r["probe"]["modes"] == ["KEEP_WARM", "FAULT_IN"]
          assert len(r["summaries"]) == 6
          assert r["checks"]["job_semantics_equal_across_all_six_arms"] is True
          assert r["checks"]["fault_in_prestart_pss_lower_than_keep_warm_for_each_worker_count"] is True
          assert len(r["pareto_plan_ids"]) >= 1
          PY
          sha256sum specs/FR-P9-007.json
          sha256sum runs/FR-P9-007/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-p9-007-hosted-joint-frontier
          path: runs/FR-P9-007/result.json
          if-no-files-found: error
