name: Deep Monte Carlo Quality

on:
  workflow_dispatch:
    inputs:
      trials_per_shard:
        description: Trials per family/shard
        required: false
        default: "2000"
      bootstrap_resamples:
        description: Bootstrap resamples
        required: false
        default: "500"
  schedule:
    - cron: "17 18 * * 0"
  push:
    paths:
      - ".github/workflows/deep-monte-carlo.yml"
      - "src/finite_ram_lab/mc_quality.py"
      - "src/finite_ram_lab/mc.py"
      - "src/finite_ram_lab/sim.py"
      - "specs/MC-QUALITY-001.json"
      - "docs/MC-QUALITY.md"

permissions:
  contents: read

concurrency:
  group: deep-monte-carlo
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        family: [stable_hotset, sequential_scan, shifting_hotset, bursty]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run deep shard
        env:
          FAMILY: ${{ matrix.family }}
          SHARD: ${{ matrix.shard }}
          DISPATCH_TRIALS: ${{ inputs.trials_per_shard }}
        run: |
          TRIALS="${DISPATCH_TRIALS:-2000}"
          SEED=$((20260926 + SHARD * 100003))
          mkdir -p evidence/MC-QUALITY-001/shards
          python -m finite_ram_lab.mc \
            --family "$FAMILY" \
            --seed "$SEED" \
            --trials "$TRIALS" \
            --out "evidence/MC-QUALITY-001/shards/mc-${FAMILY}-${SHARD}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: deep-mc-${{ matrix.family }}-${{ matrix.shard }}
          path: evidence/MC-QUALITY-001/shards/*.json
          if-no-files-found: error
          retention-days: 90

  quality:
    needs: simulate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: deep-mc-*
          path: evidence/MC-QUALITY-001/shards
          merge-multiple: true
      - name: Quantify uncertainty and coverage
        env:
          DISPATCH_BOOTSTRAP: ${{ inputs.bootstrap_resamples }}
        run: |
          BOOT="${DISPATCH_BOOTSTRAP:-500}"
          python -m finite_ram_lab.mc_quality \
            --input evidence/MC-QUALITY-001/shards \
            --out evidence/MC-QUALITY-001/quality.json \
            --markdown evidence/MC-QUALITY-001/summary.md \
            --bootstrap-resamples "$BOOT" \
            --seed 2026092601 \
            --rare-threshold 0.20
          cat evidence/MC-QUALITY-001/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: MC-QUALITY-001-${{ github.run_id }}
          path: |
            evidence/MC-QUALITY-001/quality.json
            evidence/MC-QUALITY-001/summary.md
          if-no-files-found: error
          retention-days: 90
