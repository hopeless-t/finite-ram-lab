name: FR-SOOM-002K Cross-Tier Pressure

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-soom-002k-cross-tier-pressure
    paths:
      - "src/finite_ram_lab/semantic_oom_cross_tier.py"
      - "specs/FR-SOOM-002K.json"
      - "tests/test_semantic_oom_cross_tier.py"
      - "docs/FR-SOOM-002K-CROSS-TIER-PRESSURE.md"
      - ".github/workflows/fr-soom-002k.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_semantic_oom_cross_tier -v
      - name: Run cross-tier panel
        run: |
          mkdir -p runs/FR-SOOM-002K
          python -m finite_ram_lab.semantic_oom_cross_tier \
            > runs/FR-SOOM-002K/result.json
          python - <<'PY'
          import json
          r=json.load(open("runs/FR-SOOM-002K/result.json"))
          assert r["status"] == "PASS"
          p=r["policies"]
          assert p["TIER_LOCAL_GREEDY"]["current_task_loss_count"] == 106
          assert p["TIER_LOCAL_GREEDY"]["reliability_qualified"] is False
          assert p["REACTIVE_SHRINK"]["current_task_loss_count"] == 17
          assert p["REACTIVE_SHRINK"]["reliability_qualified"] is False
          assert p["CROSS_TIER_HEADROOM"]["current_task_loss_count"] == 0
          assert p["CROSS_TIER_HEADROOM"]["reliability_qualified"] is True
          assert r["primary_finding"] == "TIER_LOCAL_RELIEF_DOES_NOT_IMPLY_GLOBAL_SEMANTIC_RELIEF"
          PY
          sha256sum specs/FR-SOOM-002K.json
          sha256sum runs/FR-SOOM-002K/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-soom-002k-cross-tier-pressure
          path: runs/FR-SOOM-002K/result.json
          if-no-files-found: error
