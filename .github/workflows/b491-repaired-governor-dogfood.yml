name: B491 Repaired Governor Dogfood

on:
  workflow_dispatch:
  push:
    branches:
      - research/repaired-governor-dogfood-b491
    paths:
      - "src/finite_ram_lab/repaired_governor_dogfood.py"
      - "src/finite_ram_lab/repaired_governor_dogfood_aggregate.py"
      - "tests/test_repaired_governor_dogfood.py"
      - "docs/B491-REPAIRED-GOVERNOR-DOGFOOD-v0.1.md"
      - ".github/workflows/b491-repaired-governor-dogfood.yml"

permissions:
  contents: read

jobs:
  block:
    strategy:
      fail-fast: false
      matrix:
        block: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Run v2 dogfood block
        run: |
          mkdir -p runs/B491
          python -m finite_ram_lab.repaired_governor_dogfood \
            --b489 analysis/inputs/B489-REPAIRED-CALIBRATION-RESULT-v0.1.json \
            --b490 analysis/inputs/B490-REPAIRED-GOVERNOR-V2-RESULT-v0.1.json \
            --block-id ${{ matrix.block }} \
            --size 2048 \
            --out runs/B491/block-${{ matrix.block }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: b491-dogfood-block-${{ matrix.block }}
          path: runs/B491/block-${{ matrix.block }}.json
          if-no-files-found: error

  aggregate:
    needs: block
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Targeted tests
        run: python -m unittest tests.test_repaired_governor_dogfood -v
      - uses: actions/download-artifact@v4
        with:
          pattern: b491-dogfood-block-*
          path: runs/B491/blocks
          merge-multiple: true
      - name: Aggregate v2 dogfood
        run: |
          python -m finite_ram_lab.repaired_governor_dogfood_aggregate \
            --blocks-dir runs/B491/blocks \
            --out runs/B491/repaired-governor-dogfood.json
          python -m json.tool runs/B491/repaired-governor-dogfood.json >/dev/null
          sha256sum runs/B491/repaired-governor-dogfood.json
      - uses: actions/upload-artifact@v4
        with:
          name: b491-repaired-governor-dogfood
          path: runs/B491/repaired-governor-dogfood.json
          if-no-files-found: error
