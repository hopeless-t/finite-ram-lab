name: GATE-002 Class-Conditional Frontier

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gate-002-frontier.yml"

permissions:
  contents: read

jobs:
  frontier-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Run class-conditional frontier
        run: |
          mkdir -p evidence/GATE-002
          python -m finite_ram_lab.gate002_frontier \
            --spec specs/GATE-002-DESIGN.json \
            --out evidence/GATE-002/frontier.json \
            --markdown evidence/GATE-002/summary.md
          cat evidence/GATE-002/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: GATE-002-FRONTIER-${{ github.run_id }}
          path: evidence/GATE-002/
          if-no-files-found: error
          retention-days: 90
