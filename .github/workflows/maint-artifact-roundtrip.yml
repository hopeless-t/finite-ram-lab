name: MAINT Artifact Roundtrip

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/maint-artifact-roundtrip.yml"

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create deterministic payload
        run: |
          mkdir -p maint-artifact
          printf 'finite-ram-lab artifact roundtrip\n' > maint-artifact/payload.txt
          sha256sum maint-artifact/payload.txt > maint-artifact/payload.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: maint-roundtrip-${{ github.run_id }}
          path: maint-artifact/
          if-no-files-found: error
          retention-days: 7

  consume:
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: maint-roundtrip-${{ github.run_id }}
          path: maint-artifact
      - name: Verify payload
        run: |
          test -f maint-artifact/payload.txt
          test -f maint-artifact/payload.sha256
          (cd maint-artifact && sha256sum -c payload.sha256)
