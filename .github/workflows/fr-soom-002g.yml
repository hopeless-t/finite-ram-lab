name: FR-SOOM-002G Inference Planner

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-soom-002g-inference-informed-planner
    paths:
      - "src/finite_ram_lab/semantic_oom_inference_planner.py"
      - "specs/FR-SOOM-002G.json"
      - "tests/test_semantic_oom_inference_planner.py"
      - "docs/FR-SOOM-002G-INFERENCE-PLANNER.md"
      - ".github/workflows/fr-soom-002g.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_semantic_oom_inference_planner -v
      - name: Run inference-informed planner panel
        run: |
          mkdir -p runs/FR-SOOM-002G
          python -m finite_ram_lab.semantic_oom_inference_planner \
            > runs/FR-SOOM-002G/result.json
          python - <<'PY'
          import json
          r=json.load(open("runs/FR-SOOM-002G/result.json"))
          assert r["status"] == "PASS"
          a=r["arms"]
          assert a["INDEPENDENT"]["future_policies"]["DEPENDENCE_AWARE"]["deadline_failures"] == 1
          assert a["INDEPENDENT"]["future_policies"]["DEPENDENCE_AWARE"]["reliability_qualified"] is True
          assert a["SHARED_BAD"]["future_policies"]["NAIVE_COOPERATIVE"]["deadline_failures"] == 82
          assert a["SHARED_BAD"]["future_policies"]["NAIVE_COOPERATIVE"]["reliability_qualified"] is False
          assert a["SHARED_BAD"]["future_policies"]["DEPENDENCE_AWARE"]["deadline_failures"] == 0
          assert a["SHARED_BAD"]["future_policies"]["DEPENDENCE_AWARE"]["p99_semantic_loss"] == 73
          assert a["SHARED_BAD"]["future_policies"]["KILL_FIRST"]["current_task_loss_count"] == 8192
          PY
          sha256sum specs/FR-SOOM-002G.json
          sha256sum runs/FR-SOOM-002G/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-soom-002g-inference-planner
          path: runs/FR-SOOM-002G/result.json
          if-no-files-found: error
