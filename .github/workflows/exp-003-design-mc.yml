name: EXP-003 Design Monte Carlo

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/exp-003-design-mc.yml"

permissions:
  contents: read

jobs:
  design-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Run design Monte Carlo
        run: |
          mkdir -p evidence/EXP-003-DESIGN
          python -m finite_ram_lab.exp003_design_mc \
            --spec specs/EXP-003-DESIGN-MC.json \
            --out evidence/EXP-003-DESIGN/design.json \
            --markdown evidence/EXP-003-DESIGN/summary.md
          cat evidence/EXP-003-DESIGN/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: EXP-003-DESIGN-${{ github.run_id }}
          path: evidence/EXP-003-DESIGN/
          if-no-files-found: error
          retention-days: 90
