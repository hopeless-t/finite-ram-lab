name: STRATA-005 External Validity v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pressure: [144, 176]
        block: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[analysis]"
      - name: Prepare cold file
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from finite_ram_lab.strata001_probe import _prepare_file
          p=Path(os.environ["RUNNER_TEMP"])/"strata005-cold.bin"
          _prepare_file(p,96*1024*1024,4*1024*1024)
          PY
      - name: Schedule
        env: {PRESSURE: ${{ matrix.pressure }}, BLOCK: ${{ matrix.block }}}
        run: |
          ROOT="evidence/STRATA-005/high-${PRESSURE}/block-${BLOCK}"; mkdir -p "${ROOT}/raw" "${ROOT}/recorder"
          python -m finite_ram_lab.strata005_external_validity schedule --spec specs/STRATA-005-EXTERNAL-VALIDITY-v1.json --pressure "${PRESSURE}" --block "${BLOCK}" --out "${ROOT}/schedule.csv"
      - name: Run
        env: {PRESSURE: ${{ matrix.pressure }}, BLOCK: ${{ matrix.block }}}
        run: |
          set -euo pipefail
          PY="$(command -v python)"; HIGH_BYTES=$((PRESSURE*1024*1024)); MAX_BYTES=$((320*1024*1024))
          ROOT="$GITHUB_WORKSPACE/evidence/STRATA-005/high-${PRESSURE}/block-${BLOCK}"
          tail -n +2 "${ROOT}/schedule.csv" | while IFS=, read -r ORDER ARM; do
            OUT="${ROOT}/raw/trial-${ORDER}-${ARM}.json"
            RAW="${ROOT}/recorder/trial-${ORDER}-${ARM}.jsonl"
            UNIT="finite-ram-strata005-${GITHUB_RUN_ID}-${PRESSURE}-${BLOCK}-${ORDER}"
            sudo systemd-run --pipe --wait --collect --quiet --unit="$UNIT" -p MemoryAccounting=yes -p MemoryHigh="$HIGH_BYTES" -p MemoryMax="$MAX_BYTES"               "$PY" -m finite_ram_lab.strata004_knee_workload --arm "$ARM" --file "$RUNNER_TEMP/strata005-cold.bin" --hot-anon-mib 64 --buffer-mib 4 --expected-file-mib 96 --expected-high-bytes "$HIGH_BYTES" --expected-max-bytes "$MAX_BYTES" --precache-limit 0.10 --out "$OUT" >/dev/null
          done
          sudo chown -R "$(id -u):$(id -g)" "${ROOT}"
      - uses: actions/upload-artifact@v7
        with:
          name: strata005-high-${{ matrix.pressure }}-block-${{ matrix.block }}
          path: evidence/STRATA-005/high-${{ matrix.pressure }}/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: block
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[analysis]"
      - uses: actions/download-artifact@v8
        with: {pattern: "strata005-high-*", path: "evidence/STRATA-005"}
      - run: python -m finite_ram_lab.strata005_external_validity aggregate --spec specs/STRATA-005-EXTERNAL-VALIDITY-v1.json --input-root evidence/STRATA-005 --out evidence/STRATA-005/aggregate/summary.json
      - uses: actions/upload-artifact@v7
        with:
          name: STRATA-005-EXTERNAL-VALIDITY-${{ github.run_id }}
          path: evidence/STRATA-005/aggregate/
          if-no-files-found: error
          retention-days: 90
