name: VAL-001 Cross-Runner Validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/val-001.yml"
      - "src/finite_ram_lab/val_replicate.py"
      - "src/finite_ram_lab/obs_workload.py"
      - "src/finite_ram_lab/char_sweep.py"
      - "specs/VAL-001.json"
      - "docs/VAL-001.md"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Build block schedule
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          mkdir -p "evidence/VAL-001/block-${BLOCK}/raw"
          python -m finite_ram_lab.val_replicate schedule \
            --spec specs/VAL-001.json \
            --block "$BLOCK" \
            --out "evidence/VAL-001/block-${BLOCK}/schedule.csv"
      - name: Run paired block
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          MAX_BYTES=$((320 * 1024 * 1024))
          SCHEDULE="evidence/VAL-001/block-${BLOCK}/schedule.csv"
          tail -n +2 "$SCHEDULE" | while IFS=, read -r ORDER REPEAT HIGH_MIB; do
            HIGH_BYTES=$((HIGH_MIB * 1024 * 1024))
            UNIT="finite-ram-val001-${GITHUB_RUN_ID}-${BLOCK}-${ORDER}"
            OUT="$GITHUB_WORKSPACE/evidence/VAL-001/block-${BLOCK}/raw/timeline-${ORDER}-high${HIGH_MIB}-rep${REPEAT}.json"
            sudo systemd-run \
              --pipe --wait --collect --quiet \
              --unit="$UNIT" \
              -p MemoryAccounting=yes \
              -p MemoryHigh="$HIGH_BYTES" \
              -p MemoryMax="$MAX_BYTES" \
              "$PY" -m finite_ram_lab.obs_workload \
                --hotset-mib 64 \
                --burst-mib 96 \
                --expected-high-bytes "$HIGH_BYTES" \
                --expected-max-bytes "$MAX_BYTES" \
                --out "$OUT" >/dev/null
            sleep 0.05
          done
          sudo chown -R "$(id -u):$(id -g)" "evidence/VAL-001/block-${BLOCK}"
      - uses: actions/upload-artifact@v4
        with:
          name: val001-block-${{ matrix.block }}
          path: evidence/VAL-001/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: block
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - uses: actions/download-artifact@v4
        with:
          pattern: val001-block-*
          path: evidence/VAL-001
      - name: Aggregate validation evidence
        run: |
          python -m finite_ram_lab.val_replicate aggregate \
            --spec specs/VAL-001.json \
            --input-root evidence/VAL-001 \
            --out-dir evidence/VAL-001/aggregate
      - name: Job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, json
          print('# VAL-001')
          print()
          meta=json.load(open('evidence/VAL-001/aggregate/meta.json'))
          print(f"Execution status: **{meta['execution_status']}**")
          print()
          print('## Per-runner breakpoint estimates')
          print()
          print('| Block | Breakpoint MiB | 160/192 latency ratio |')
          print('| ---: | ---: | ---: |')
          for r in csv.DictReader(open('evidence/VAL-001/aggregate/per-block.csv')):
              print(f"| {r['block']} | {float(r['breakpoint_mib']):.1f} | {float(r['endpoint_ratio_160_over_192']):.1f} |")
          print()
          bs=meta['cluster_bootstrap']
          print('## Cluster-bootstrap boundary')
          print()
          print(f"Median breakpoint: **{bs['median_breakpoint_mib']:.1f} MiB**")
          print(f"95% cluster-bootstrap interval: **[{bs['ci95_mib'][0]:.1f}, {bs['ci95_mib'][1]:.1f}] MiB**")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: VAL-001-aggregate-${{ github.run_id }}
          path: evidence/VAL-001/aggregate/
          if-no-files-found: error
          retention-days: 90
