name: FR-SOOM-001 Semantic OOM

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-soom-001-semantic-oom
    paths:
      - "src/finite_ram_lab/semantic_oom.py"
      - "specs/FR-SOOM-001.json"
      - "tests/test_semantic_oom.py"
      - "docs/FR-SOOM-001-SEMANTIC-OOM.md"
      - ".github/workflows/fr-soom-001.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_semantic_oom -v
      - name: Run semantic OOM panel
        run: |
          mkdir -p runs/FR-SOOM-001
          python -m finite_ram_lab.semantic_oom \
            > runs/FR-SOOM-001/result.json
          python - <<'PY'
          import json
          r=json.load(open("runs/FR-SOOM-001/result.json"))
          assert r["status"] == "PASS"
          assert r["semantic_current_task_survival_deficits_mib"] == [1024, 2048, 3072]
          imp=r["semantic_loss_improvement_vs_oom_score"]
          assert all(v > 0 for v in imp.values())
          assert r["empirical_earlyoom_claim"] is False
          PY
          sha256sum specs/FR-SOOM-001.json
          sha256sum runs/FR-SOOM-001/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-soom-001-semantic-oom
          path: runs/FR-SOOM-001/result.json
          if-no-files-found: error
