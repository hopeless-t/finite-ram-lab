name: HYP-002 Design Monte Carlo

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hyp-002-design-mc.yml"
      - "src/finite_ram_lab/hyp002_design_mc.py"
      - "docs/HYP-002-DESIGN.md"

permissions:
  contents: read

jobs:
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Run design Monte Carlo
        run: |
          mkdir -p evidence/HYP-002-DESIGN
          python -m finite_ram_lab.hyp002_design_mc \
            --simulations 20000 \
            --seed 2026092623 \
            --out evidence/HYP-002-DESIGN/design.json \
            --markdown evidence/HYP-002-DESIGN/summary.md
          cat evidence/HYP-002-DESIGN/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: HYP-002-DESIGN-${{ github.run_id }}
          path: evidence/HYP-002-DESIGN/
          if-no-files-found: error
          retention-days: 90
