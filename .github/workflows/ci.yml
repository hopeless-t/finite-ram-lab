name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - name: Compile
        run: |
          python -m compileall -q src tests
          gcc -O2 -Wall -Wextra -std=c11 experiments/obs005_handoff_worker.c -o /tmp/obs005_handoff_worker
          gcc -O2 -Wall -Wextra -std=c11 experiments/obs006_masked_q64_worker.c -o /tmp/obs006_masked_q64_worker
          gcc -O2 -Wall -Wextra -std=c11 experiments/tx_perturbation_worker.c -o /tmp/tx_perturbation_worker

      - name: Unit tests
        id: unit_tests
        shell: bash
        run: |
          mkdir -p runs/CI
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee runs/CI/unit-tests.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > runs/CI/unit-tests.exit-code
          set -e
          exit "$rc"

      - name: Upload unit-test failure diagnostics
        if: ${{ failure() && steps.unit_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/CI/unit-tests.log
            runs/CI/unit-tests.exit-code
          if-no-files-found: error
          retention-days: 30

      - name: Monte Carlo smoke test
        run: |
          mkdir -p runs/MC-001
          python -m finite_ram_lab.mc \
            --family stable_hotset \
            --seed 20260926 \
            --trials 25 \
            --out runs/MC-001/smoke.json

      - name: Environment probe smoke test
        run: |
          mkdir -p runs/ENV-001
          python -m finite_ram_lab.env_probe \
            --out runs/ENV-001/probe.json >/dev/null
          python -m json.tool runs/ENV-001/probe.json >/dev/null
