name: FR-GFX-004 Adaptive Observation Cadence

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-gfx-004-adaptive-observation-cadence
    paths:
      - "src/finite_ram_lab/fr_gfx_observation_cadence.py"
      - "tests/test_fr_gfx_observation_cadence.py"
      - "specs/FR-GFX-004.json"
      - "docs/FR-GFX-004-ADAPTIVE-OBSERVATION-CADENCE.md"
      - ".github/workflows/fr-gfx-004.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest tests.test_fr_gfx_observation_cadence -v
      - name: Run cadence model
        run: |
          mkdir -p runs/FR-GFX-004
          python -m finite_ram_lab.fr_gfx_observation_cadence > runs/FR-GFX-004/result.json
          python - <<'PY'
          import json
          r=json.load(open("runs/FR-GFX-004/result.json"))
          assert r["status"] == "PASS"
          assert r["adaptive_sampling"]["detection_probability"] == 0.937
          assert r["adaptive_sampling"]["samples_per_second"] == 3.8
          assert r["adaptive_sampling"]["sampling_reduction_vs_always_fast"] == 0.81
          PY
          sha256sum specs/FR-GFX-004.json
          sha256sum runs/FR-GFX-004/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-gfx-004-adaptive-observation-cadence
          path: runs/FR-GFX-004/result.json
          if-no-files-found: error
