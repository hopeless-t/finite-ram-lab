name: ENV-006 PAGEOUT Natural Pressure Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/env-006.yml"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - name: Build schedule
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          mkdir -p "evidence/ENV-006/block-${BLOCK}/raw"
          python -m finite_ram_lab.env006_study schedule \
            --spec specs/ENV-006.json \
            --block "$BLOCK" \
            --out "evidence/ENV-006/block-${BLOCK}/schedule.csv"
      - name: Run pageout-prepared probes
        env:
          BLOCK: ${{ matrix.block }}
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          tail -n +2 "evidence/ENV-006/block-${BLOCK}/schedule.csv" | while IFS=, read -r ORDER TARGET; do
            UNIT="finite-ram-env006-${GITHUB_RUN_ID}-${BLOCK}-${ORDER}"
            OUT="$GITHUB_WORKSPACE/evidence/ENV-006/block-${BLOCK}/raw/trial-${ORDER}-target${TARGET}.json"
            sudo systemd-run \
              --pipe --wait --collect --quiet \
              --unit="$UNIT" \
              -p MemoryAccounting=yes \
              -p MemoryHigh=$((164 * 1024 * 1024)) \
              -p MemoryMax=$((320 * 1024 * 1024)) \
              "$PY" -m finite_ram_lab.pageout_pressure_probe \
                --target-identity "$TARGET" \
                --region-mib 32 \
                --pageout-mib 16 \
                --burst-mib 96 \
                --out "$OUT"
          done
          sudo chown -R "$(id -u):$(id -g)" "evidence/ENV-006/block-${BLOCK}"
      - uses: actions/upload-artifact@v4
        with:
          name: env006-block-${{ matrix.block }}
          path: evidence/ENV-006/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: block
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[analysis]"
      - uses: actions/download-artifact@v4
        with:
          pattern: env006-block-*
          path: evidence/ENV-006
      - name: Aggregate
        run: |
          python -m finite_ram_lab.env006_study aggregate \
            --spec specs/ENV-006.json \
            --input-root evidence/ENV-006 \
            --out-dir evidence/ENV-006/aggregate
      - name: Summary
        run: cat evidence/ENV-006/aggregate/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ENV-006-aggregate-${{ github.run_id }}
          path: evidence/ENV-006/aggregate/
          if-no-files-found: error
          retention-days: 90
