name: FR-P9-022 Stage Release Service Composition

on:
  push:
    branches:
      - research/fr-p9-022-stage-release-service-composition
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Targeted stage-composition tests
        run: python -m unittest tests.test_fr_p9_022_stage_release_service_composition -v
      - name: Run analytic qualification
        run: |
          mkdir -p runs/FR-P9-022
          python -m finite_ram_lab.fr_p9_022_stage_release_service_composition \
            --seed 20261008 --trials 5000 > runs/FR-P9-022/result.json
          python - <<'PY'
          import json
          r = json.load(open("runs/FR-P9-022/result.json"))
          assert r["status"] == "PASS"
          assert r["exhaustive"]["mismatches"] == 0
          assert r["release_order_adversary"]["naive_front_admit"] is True
          assert r["release_order_adversary"]["front_usable_cpu_service"] == 0
          assert r["monte_carlo"]["naive_independent_false_admits"] > 0
          assert r["monte_carlo"]["stage_aware_false_admits"] == 0
          assert r["stale_stage_adversary"]["status"] == "REPLAN_REQUIRED"
          assert r["authority_effect"] == "NONE"
          assert r["retry_authority"] is False
          assert r["scalar_gain"] is None
          assert all(r["checks"].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fr-p9-022-stage-release-service-composition
          path: runs/FR-P9-022/result.json
          if-no-files-found: error
