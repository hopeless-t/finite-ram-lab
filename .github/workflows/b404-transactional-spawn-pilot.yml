name: B404 transactional spawn pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launch/B404-TRANSACTIONAL-SPAWN-PILOT-v1.txt"

permissions:
  contents: read

jobs:
  block:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        block: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - name: Compile PTE-preconditioned worker
        run: |
          mkdir -p build
          gcc -O2 -Wall -Wextra -std=c11             experiments/memcg005gc_spawn_worker.c             -o build/memcg005gc_spawn_worker

      - name: Environment gate
        run: |
          set -euo pipefail
          test "$(getconf PAGESIZE)" = "4096"
          test "$(stat -fc %T /sys/fs/cgroup)" = "cgroup2fs"
          test "$(nproc)" -ge 3
          uname -a
          cat /sys/kernel/mm/transparent_hugepage/enabled || true

      - name: Run transactional block
        env:
          BLOCK: "${{ matrix.block }}"
        run: |
          set -euo pipefail
          TRACE=/sys/kernel/tracing
          OUT="$GITHUB_WORKSPACE/evidence/B404/block-$BLOCK"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          if ! mountpoint -q "$TRACE"; then
            sudo mount -t tracefs nodev "$TRACE"
          fi

          cleanup() (
            set +e
            echo 0 | sudo tee "$TRACE/tracing_on" >/dev/null 2>&1
            for ev in               frl_refill_stock frl_pc_try64 frl_pc_uncharge17               frl_lru_flush frl_folios_put frl_drain_stock; do
              if test -e "$TRACE/events/kprobes/$ev/enable"; then
                echo 0 | sudo tee "$TRACE/events/kprobes/$ev/enable" >/dev/null 2>&1
              fi
              printf '%s\n' "-:$ev"                 | sudo tee -a "$TRACE/kprobe_events" >/dev/null 2>&1
            done
            true
          )
          trap cleanup EXIT
          cleanup

          printf '%s\n'             'p:frl_refill_stock refill_stock memcg=$arg1:x64 nr_pages=$arg2:u32 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_pc_try64 page_counter_try_charge counter=$arg1:x64 nr_pages=$arg2:u64 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_pc_uncharge17 page_counter_uncharge counter=$arg1:x64 nr_pages=$arg2:u64 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_lru_flush folio_batch_move_lru fbatch=$arg1:x64 nr=+0($arg1):u8 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_folios_put folios_put_refs fbatch=$arg1:x64 nr=+0($arg1):u8 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null
          printf '%s\n'             'p:frl_drain_stock drain_stock stock=$arg1:x64 slot=$arg2:u32 comm=$comm'             | sudo tee -a "$TRACE/kprobe_events" >/dev/null

          echo 'comm == "memcg005gc_spaw" && nr_pages == 63'             | sudo tee "$TRACE/events/kprobes/frl_refill_stock/filter" >/dev/null
          echo 'comm == "memcg005gc_spaw" && nr_pages == 64'             | sudo tee "$TRACE/events/kprobes/frl_pc_try64/filter" >/dev/null
          echo 'nr_pages == 17'             | sudo tee "$TRACE/events/kprobes/frl_pc_uncharge17/filter" >/dev/null
          echo 'nr == 31'             | sudo tee "$TRACE/events/kprobes/frl_lru_flush/filter" >/dev/null
          echo 'nr == 31'             | sudo tee "$TRACE/events/kprobes/frl_folios_put/filter" >/dev/null

          for ev in             frl_refill_stock frl_pc_try64 frl_pc_uncharge17             frl_lru_flush frl_folios_put frl_drain_stock; do
            echo 1 | sudo tee "$TRACE/events/kprobes/$ev/enable" >/dev/null
            sudo cat "$TRACE/events/kprobes/$ev/format" > "$OUT/$ev.format"
          done

          RUNNER_UID="$(id -u)"
          PYTHON_BIN="$(command -v python)"
          echo 32768 | sudo tee "$TRACE/buffer_size_kb" >/dev/null
          echo 0 | sudo tee "$TRACE/tracing_on" >/dev/null
          echo | sudo tee "$TRACE/trace" >/dev/null
          echo 1 | sudo tee "$TRACE/tracing_on" >/dev/null

          sudo -E "$PYTHON_BIN"             -m finite_ram_lab.transactional_spawn_pilot run-block             --spec "$GITHUB_WORKSPACE/specs/TRANSACTIONAL-SPAWN-PILOT-v1.json"             --block "$BLOCK"             --worker "$GITHUB_WORKSPACE/build/memcg005gc_spawn_worker"             --out-root "$OUT"             --trace-marker "$TRACE/trace_marker"             --trace-path "$TRACE/trace"             --worker-uid "$RUNNER_UID"

          echo 0 | sudo tee "$TRACE/tracing_on" >/dev/null
          sudo cat "$TRACE/trace" > "$OUT/trace.log"
          {
            echo "=== KPROBE PROFILE ==="
            sudo cat "$TRACE/kprobe_profile" || true
          } > "$OUT/trace-stats.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: b404-block-${{ matrix.block }}
          path: evidence/B404/block-${{ matrix.block }}/
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: block
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - uses: actions/download-artifact@v8
        with:
          pattern: b404-block-*
          path: evidence/B404/input

      - name: Aggregate
        run: |
          mkdir -p evidence/B404/aggregate
          python -m finite_ram_lab.transactional_spawn_pilot aggregate             --spec specs/TRANSACTIONAL-SPAWN-PILOT-v1.json             --input-root evidence/B404/input             --json-out evidence/B404/aggregate/summary.json

      - name: Freeze raw evidence manifest
        run: |
          frl evidence-manifest             evidence/B404/input             --out evidence/B404/aggregate/full-raw-evidence-manifest.json             --experiment-id TRANSACTIONAL-SPAWN-PILOT-v1             --run-id "$GITHUB_RUN_ID"             --source-commit "$GITHUB_SHA"             --tier HOT             --origin-provider github-actions             --origin-ref "run:$GITHUB_RUN_ID"

      - name: Verify raw evidence
        run: |
          frl evidence-verify             evidence/B404/input             --manifest evidence/B404/aggregate/full-raw-evidence-manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: B404-TRANSACTIONAL-SPAWN-PILOT-${{ github.run_id }}
          path: evidence/B404/aggregate/
          if-no-files-found: error
          retention-days: 30
