name: FR-ALLOC-001 Fragmentation Surface

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-alloc-001-fragmentation-surface
    paths:
      - "src/finite_ram_lab/fr_allocator_surface.py"
      - "tests/test_fr_allocator_surface.py"
      - "specs/FR-ALLOC-001.json"
      - "docs/FR-ALLOC-001-FRAGMENTATION-SURFACE.md"
      - ".github/workflows/fr-alloc-001.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest tests.test_fr_allocator_surface -v
      - name: Run allocator panel
        run: |
          mkdir -p runs/FR-ALLOC-001
          python -m finite_ram_lab.fr_allocator_surface > runs/FR-ALLOC-001/result.json
          python - <<'PY'
          import json
          r=json.load(open("runs/FR-ALLOC-001/result.json"))
          assert r["status"] == "PASS"
          assert r["policies"]["CONTIG_FIRST_FIT"]["external_fragmentation_rejects"] == 615
          assert r["policies"]["PAGED_PREFIX_SHARE"]["rejected"] == 241
          assert r["block_granularity"]["16"]["waste_fraction"] < r["block_granularity"]["128"]["waste_fraction"]
          PY
          sha256sum specs/FR-ALLOC-001.json
          sha256sum runs/FR-ALLOC-001/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-alloc-001-fragmentation-surface
          path: runs/FR-ALLOC-001/result.json
          if-no-files-found: error
