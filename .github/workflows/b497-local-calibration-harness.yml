name: B497 Local Calibration Harness

on:
  workflow_dispatch:
  push:
    branches:
      - research/local-calibration-harness-b497
    paths:
      - "src/finite_ram_lab/local_calibration_explore.py"
      - "src/finite_ram_lab/cli.py"
      - "tests/test_local_calibration_explore.py"
      - "docs/B497-LOCAL-CALIBRATION-HARNESS-v0.1.md"
      - ".github/workflows/b497-local-calibration-harness.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install analysis runtime
        run: python -m pip install -e ".[analysis]"
      - name: Targeted tests
        run: python -m unittest tests.test_local_calibration_explore -v
      - name: Hosted harness smoke only
        run: |
          mkdir -p runs/B497
          frl local-calibrate \
            --samples-per-q 2 \
            --size 64 \
            --target-rank-coverage 0.95 \
            --out runs/B497/hosted-harness-smoke.json
          python - <<'PY'
          import json
          r=json.load(open("runs/B497/hosted-harness-smoke.json"))
          assert r["status"] == "EXPLORATION_COMPLETE"
          assert r["candidate_q"] == [1,2,4,7]
          assert r["samples_per_q"] == 2
          assert r["physical_observations"] == 8
          assert r["policy_promotion_allowed"] is False
          assert r["hosted_threshold_imported"] is False
          PY
          sha256sum runs/B497/hosted-harness-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: b497-local-calibration-harness-smoke
          path: runs/B497/hosted-harness-smoke.json
          if-no-files-found: error
