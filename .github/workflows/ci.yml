name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install
        run: python -m pip install -e ".[analysis]"

      - name: Compile
        run: |
          python -m compileall -q src tests
          gcc -O2 -Wall -Wextra -std=c11 experiments/obs005_handoff_worker.c -o /tmp/obs005_handoff_worker
          gcc -O2 -Wall -Wextra -std=c11 experiments/obs006_masked_q64_worker.c -o /tmp/obs006_masked_q64_worker
          gcc -O2 -Wall -Wextra -std=c11 experiments/tx_perturbation_worker.c -o /tmp/tx_perturbation_worker

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Monte Carlo smoke test
        run: |
          mkdir -p runs/MC-001
          python -m finite_ram_lab.mc             --family stable_hotset             --seed 20260926             --trials 25             --out runs/MC-001/smoke.json

      - name: Environment probe smoke test
        run: |
          mkdir -p runs/ENV-001
          python -m finite_ram_lab.env_probe             --out runs/ENV-001/probe.json >/dev/null
          python -m json.tool runs/ENV-001/probe.json >/dev/null

      - name: Auto-qualify changed meta panels
        run: |
          mkdir -p runs/meta-qualification
          python -m finite_ram_lab.meta_qualifier             --changed-from HEAD^             --out-dir runs/meta-qualification

      - uses: actions/upload-artifact@v4
        with:
          name: meta-qualification
          path: runs/meta-qualification/
          if-no-files-found: ignore
