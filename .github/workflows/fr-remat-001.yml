name: FR-REMAT-001 Retain Recompute Offload

on:
  workflow_dispatch:
  push:
    branches:
      - research/fr-remat-001-retain-recompute-offload
    paths:
      - "src/finite_ram_lab/fr_rematerialization.py"
      - "tests/test_fr_rematerialization.py"
      - "specs/FR-REMAT-001.json"
      - "docs/FR-REMAT-001-RETAIN-RECOMPUTE-OFFLOAD.md"
      - ".github/workflows/fr-remat-001.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest tests.test_fr_rematerialization -v
      - name: Run rematerialization planner
        run: |
          mkdir -p runs/FR-REMAT-001
          python -m finite_ram_lab.fr_rematerialization > runs/FR-REMAT-001/result.json
          python - <<'PY'
          import json
          r=json.load(open("runs/FR-REMAT-001/result.json"))
          assert r["status"] == "PASS"
          assert r["baselines"]["KEEP_ALL"]["feasible"] is False
          assert r["optimal_mixed"]["objective"] < r["baselines"]["CHEAP_RECOMPUTE_FIRST"]["objective"]
          assert set(r["optimal_mixed"]["choices"]) == {"KEEP","RECOMPUTE","OFFLOAD"}
          PY
          sha256sum specs/FR-REMAT-001.json
          sha256sum runs/FR-REMAT-001/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr-remat-001-retain-recompute-offload
          path: runs/FR-REMAT-001/result.json
          if-no-files-found: error
